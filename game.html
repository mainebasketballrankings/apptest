<!-- ── Canonical ──────────────────────────────────────────────────────────
     This page IS its parameter — one game_id per document — so the canonical
     carries it. Everything else (Ghost's ?ref=, stray fragments) is dropped,
     which is what collapses the duplicate reports.

     Googlebot also speculatively crawls URL-shaped strings it finds in
     JavaScript, which is where the malformed ids came from
     (…c4ca66c4cac9:1004:1:392:27, and one literal team_id=${away.id}). Those
     render empty and get logged as soft 404s. When the parameter doesn't match
     the expected shape we mark the page noindex, so the crawler stops returning
     to a URL that was never real. -->
<link rel="canonical" href="https://app.mainebasketballrankings.com/game.html" id="mbr-canonical" />
<script>
(function(){
  var v = new URLSearchParams(location.search).get('game_id');
  var link = document.getElementById('mbr-canonical');
  if (v && /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(v)) {
    link.href = 'https://app.mainebasketballrankings.com/game.html?game_id=' + encodeURIComponent(v);
  } else if (v) {
    var m = document.createElement('meta');
    m.name = 'robots'; m.content = 'noindex,follow';
    document.head.appendChild(m);
  }
})();
</script>

      .context-strip { grid-template-columns: 1fr 1fr; }
      .ctx-item { padding: 10px 10px; }
      .ctx-val { font-size: 15px; }

  </style>

          ${logoEl(ht.logo_url, ht.school_name, 56)}
          <div class="team-name-md"><a href="team.html?team_id=${g.home_team_id}">${ht.school_name || 'Home'}</a></div>
          ${hRankLabel ? `<span class="team-rank">${hRankLabel}</span>` : ''}
          <span class="team-record" id="home-record"></span>
        </div>
      </div>

      <!-- LINESCORE -->
      ${bsj ? renderLinescore(bsj, ht.school_name, at.school_name, hScore, aScore) : ''}

      <!-- WIN PROB + RESULT BARS -->
      ${wp != null || isFinal ? `
        <div class="prob-bar-wrap">
          ${wp != null ? `
            <div class="prob-bar-labels" style="margin-bottom:4px">
              <span><span class="team-lbl">${at.school_name}</span> <span class="prob-pct" style="color:${aColor}">${pct(1-wp)}</span></span>
              <span style="color:var(--lgray);font-size:11px">Pre-game prediction</span>
              <span><span class="prob-pct" style="color:${hColor}">${pct(wp)}</span> <span class="team-lbl">${ht.school_name}</span></span>
            </div>
            <div class="prob-bar-track" style="margin-bottom:${isFinal?'12px':'0'};background:${hColor}">
              <div class="prob-bar-fill" style="width:${((1-wp)*100).toFixed(1)}%;background:${aColor}"></div>
            </div>
          ` : ''}
          ${isFinal && awp != null ? `
            <div class="prob-bar-labels" style="margin-bottom:4px">
              <span><span class="team-lbl">${at.school_name}</span> <span class="prob-pct" style="color:${aColor};${aWon?'font-weight:800':''}">${pct(1-awp)}</span></span>
              <span style="color:var(--lgray);font-size:11px">Actual Win%${isUpset ? ' &nbsp;·&nbsp; <strong style="color:var(--orange)">⚡ Upset</strong>' : ''}</span>
              <span><span class="prob-pct" style="color:${hColor};${hWon?'font-weight:800':''}">${pct(awp)}</span> <span class="team-lbl">${ht.school_name}</span></span>
            </div>
            <div class="prob-bar-track" style="background:${hColor}">
              <div class="prob-bar-fill" style="width:${((1-awp)*100).toFixed(1)}%;background:${aColor}"></div>
            </div>
          ` : ''}
        </div>
      ` : ''}

      <!-- CONTEXT STRIP -->
      <div class="context-strip">
        ${margin != null ? `
          <div class="ctx-item">
            <div class="ctx-label">${winnerName} won by</div>
            <div class="ctx-val grn">${margin}</div>
          </div>` : ''}
        ${favoredTeam != null ? `
          <div class="ctx-item">
            <div class="ctx-label">Pre-game favorite</div>
            <div class="ctx-val" style="font-size:13px;font-weight:700;line-height:1.3">${favoredTeam}</div>
            <div class="ctx-sub">${g.spread != null ? (g.spread > 0 ? '+' : '') + (+g.spread).toFixed(1) : pct(favoredPct) + ' win prob'}</div>
          </div>` : ''}
        ${isFinal && wp != null ? `
          <div class="ctx-item">
            <div class="ctx-label">Result</div>
            <div class="ctx-val ${isUpset ? 'org' : 'grn'}">${isUpset ? '⚡ Upset' : 'Expected'}</div>
          </div>` : ''}
        ${g.stax_index != null ? `
          <div class="ctx-item">
            <div class="ctx-label">⚡ Stax Index</div>
            <div class="ctx-val org">${(+g.stax_index).toFixed(1)}</div>
            <div class="ctx-sub">Game importance</div>
          </div>` : ''}
      </div>
    </div>

    <!-- BOX SCORE -->
    <div class="section">
      <div class="section-head">
        Box Score
        ${isFootball ? `<div class="section-tabs">
          <button class="sec-tab active" onclick="showFbTab('passing',this)">Passing</button>
          <button class="sec-tab" onclick="showFbTab('rushing',this)">Rushing</button>
          <button class="sec-tab" onclick="showFbTab('receiving',this)">Receiving</button>
          <button class="sec-tab" onclick="showFbTab('defense',this)">Defense</button>
          <button class="sec-tab" onclick="showFbTab('kicking',this)">Kicking</button>
        </div>` : ''}
        ${!isFootball && !bsj ? `<a href="boxscore-import.html" style="font-size:12px;font-weight:600;color:var(--orange);text-decoration:none;text-transform:none;letter-spacing:0">+ Import Stats</a>` : ''}
        ${!isFootball && bsj ? `<div class="section-tabs">
          <button class="sec-tab active" onclick="showBoxTab('batting',this)">Batting</button>
          <button class="sec-tab" onclick="showBoxTab('pitching',this)">Pitching</button>
        </div>` : ''}
      </div>
      <div class="box-wrap" id="boxContent">
        ${isFootball ? '<div class="loading" style="padding:24px">Loading box score…</div>'
          : (bsj ? renderBatting(bsj, ht.school_name, at.school_name) : `
          <div class="no-boxscore">
            <strong>No box score imported yet</strong>
            <a href="boxscore-import.html">Import stats from a PDF box score →</a>
          </div>`)}
      </div>
    </div>

    <!-- TEAM CONTEXT -->
    <div class="section" id="teamContextSection">
      <div class="section-head">Season Context</div>
      <div class="team-context-grid" id="teamContext">
        <div class="loading" style="padding:24px;grid-column:1/-1">Loading…</div>
      </div>
    </div>

  `;

  // Store for tab switching
  window._bsj  = bsj;
  window._htName = ht.school_name;
  window._atName = at.school_name;

  // Football: pull the live scorer's player_final_stats and fill the box score
  if (isFootball) {
    window._fbHomeId = g.home_team_id;
    window._fbAwayId = g.away_team_id;
    loadFootballBox(g.id).then(box => {
      window._fbBox = box;
      const el = document.getElementById('boxContent');
      if (!el) return;
      if (!box) {
        el.innerHTML = '<div class="no-boxscore"><strong>No player stats for this game</strong></div>';
        return;
      }
      // open on the first tab that actually has data
      const order = ['passing','rushing','receiving','defense','kicking'];
      const teams = [g.away_team_id, g.home_team_id];
      const first = order.find(c => teams.some(t => (box[t]||[]).some(FB_CATS[c].has))) || 'passing';
      const btns = document.querySelectorAll('.sec-tab');
      const idx = order.indexOf(first);
      showFbTab(first, btns[idx] || btns[0]);
    });
  }

  // Load season records for both teams
  loadTeamContext(g, ht, at, hSnap, aSnap, hRankLabel, aRankLabel);
  if (bsj) loadBoxScoreRosters(g).then(() => {
    // Re-render box score with full names
    showBoxTab(activeTab || 'batting', document.querySelector('.sec-tab.active'));
  });
}

// ══════════════════════════════════════════════════════
// FOOTBALL BOX SCORE
// The live scorer writes one `player_final_stats` game_event per player with the
// full stat line as JSON in `notes`, so football reads from there rather than
// games.box_score_json (which is baseball-shaped: batting/pitching).
// ══════════════════════════════════════════════════════
const FOOTBALL_SPORT_ID = 'fa905ca5-f416-409b-81ac-777179ee5576';

const FB_CATS = {
  passing: { label: 'Passing',
    cols: [['C/A', p => `${p.pc||0}/${p.pa||0}`], ['YDS', p => p.pyd||0], ['TD', p => p.ptd||0], ['INT', p => p.pint||0]],
    has: p => (p.pa||0) > 0,
    hot: p => (p.ptd||0) > 0 },
  rushing: { label: 'Rushing',
    cols: [['ATT', p => p.ra||0], ['YDS', p => p.ryd||0], ['TD', p => p.rtd||0], ['LNG', p => p.rlong||0]],
    has: p => (p.ra||0) > 0,
    hot: p => (p.rtd||0) > 0 },
  receiving: { label: 'Receiving',
    cols: [['REC', p => p.rec||0], ['YDS', p => p.recyd||0], ['TD', p => p.rectd||0], ['LNG', p => p.reclong||0]],
    has: p => (p.rec||0) > 0,
    hot: p => (p.rectd||0) > 0 },
  defense: { label: 'Defense',
    cols: [['TKL', p => p.tkl||0], ['AST', p => p.ast||0], ['SK', p => p.sack||0], ['INT', p => p.dint||0], ['PD', p => p.pd||0], ['BLK', p => p.blk||0]],
    has: p => ((p.tkl||0)+(p.ast||0)+(p.sack||0)+(p.dint||0)+(p.pd||0)+(p.blk||0)+(p.ff||0)+(p.fr||0)) > 0,
    hot: p => (p.sack||0) > 0 || (p.dint||0) > 0 },
  kicking: { label: 'Kicking',
    cols: [['FG', p => `${p.fgm||0}/${p.fga||0}`], ['XP', p => `${p.xpm||0}/${p.xpa||0}`], ['PUNT', p => p.punts||0], ['P YDS', p => p.puntyd||0]],
    has: p => ((p.fga||0)+(p.xpa||0)+(p.punts||0)) > 0,
    hot: p => false },
};

async function loadFootballBox(gameId) {
  let rows = [];
  try {
    rows = await api(`game_events?game_id=eq.${gameId}&event_type=eq.player_final_stats&select=team_id,player_name,player_num,notes`);
  } catch (e) { return null; }
  if (!rows || !rows.length) return null;
  const byTeam = {};
  rows.forEach(r => {
    let s = {};
    try { s = JSON.parse(r.notes || '{}'); } catch (e) { return; }
    s.name   = s.name || r.player_name || '';
    s.number = (s.number != null && s.number !== '') ? s.number : (r.player_num != null ? r.player_num : '');
    if (!s.name) return;
    (byTeam[r.team_id] = byTeam[r.team_id] || []).push(s);
  });
  return Object.keys(byTeam).length ? byTeam : null;
}

function renderFootballBox(cat, homeId, awayId, homeName, awayName) {
  const data = window._fbBox;
  const spec = FB_CATS[cat] || FB_CATS.passing;
  if (!data) return '<div class="no-boxscore"><strong>No player stats for this game</strong></div>';

  const sortFor = list => list.slice().sort((a, b) => {
    // headline stat descending, so the leaders sit on top
    const key = cat === 'passing' ? 'pyd' : cat === 'rushing' ? 'ryd' : cat === 'receiving' ? 'recyd'
              : cat === 'defense' ? 'tkl' : 'fga';
    return (b[key]||0) - (a[key]||0);
  });

  function rowsFor(teamId) {
    const list = sortFor((data[teamId] || []).filter(spec.has));
    if (!list.length) return null;
    return list.map(p => {
      const cells = spec.cols.map(([, fn]) => `<td class="${spec.hot(p) ? 'highlight' : ''}">${fn(p)}</td>`).join('');
      return `<tr>
        <td class="left player-name">${p.number !== '' ? '#' + p.number + ' ' : ''}${esc2(p.name)}</td>
        ${cells}
      </tr>`;
    }).join('');
  }

  const away = rowsFor(awayId), home = rowsFor(homeId);
  if (!away && !home) return `<div class="no-boxscore"><strong>No ${spec.label.toLowerCase()} stats</strong></div>`;

  const span = spec.cols.length + 1;
  const thead = `<thead><tr><th class="left">Player</th>${spec.cols.map(([h]) => `<th>${h}</th>`).join('')}</tr></thead>`;
  return `<table class="box">
    ${thead}
    <tbody>
      ${away ? `<tr class="team-divider"><td colspan="${span}">${esc2(awayName)} (Away)</td></tr>${away}` : ''}
      ${home ? `<tr class="team-divider"><td colspan="${span}">${esc2(homeName)} (Home)</td></tr>${home}` : ''}
    </tbody>
  </table>`;
}

function showFbTab(cat, btn) {
  window._fbTab = cat;
  document.querySelectorAll('.sec-tab').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  document.getElementById('boxContent').innerHTML =
    renderFootballBox(cat, window._fbHomeId, window._fbAwayId, window._htName, window._atName);
}

// minimal escaper (game.html has esc() in some builds; keep this self-contained)
function esc2(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

// ── LINESCORE ────────────────────────────────────────
function renderLinescore(bsj, homeName, awayName, hTotal, aTotal) {
  // GC box scores don't always include inning-by-inning — skip if not present
  if (!bsj?.linescore) return '';
  const ls = bsj.linescore;
  const innings = ls.innings || [];
  if (!innings.length) return '';

  const awayRow = innings.map(i => `<td>${i.away ?? '—'}</td>`).join('');
  const homeRow = innings.map(i => `<td>${i.home ?? '—'}</td>`).join('');
  const heads   = innings.map((_, i) => `<th>${i+1}</th>`).join('');

  return `<div class="linescore-wrap">
    <table class="linescore">
      <thead><tr>
        <th class="team-col" style="text-align:left">Team</th>
        ${heads}
        <th>R</th><th>H</th><th>E</th>
      </tr></thead>
      <tbody>
        <tr>
          <td class="team-col">${awayName}</td>
          ${awayRow}
          <td class="total ${aTotal > hTotal ? 'win' : ''}">${aTotal ?? '—'}</td>
          <td class="total">${ls.away_hits ?? '—'}</td>
          <td class="total">${ls.away_errors ?? '—'}</td>
        </tr>
        <tr>
          <td class="team-col">${homeName}</td>
          ${homeRow}
          <td class="total ${hTotal > aTotal ? 'win' : ''}">${hTotal ?? '—'}</td>
          <td class="total">${ls.home_hits ?? '—'}</td>
          <td class="total">${ls.home_errors ?? '—'}</td>
        </tr>
      </tbody>
    </table>
  </div>`;
}

// ── BOX SCORE TABLES ─────────────────────────────────
// Roster maps loaded async for name resolution
let _homeRoster = [], _awayRoster = [];

async function loadBoxScoreRosters(g) {
  const [hr, ar] = await Promise.all([
    api(`players?team_id=eq.${g.home_team_id}&season_year=eq.2026&select=name,number`),
    api(`players?team_id=eq.${g.away_team_id}&season_year=eq.2026&select=name,number`),
  ]);
  _homeRoster = hr || [];
  _awayRoster = ar || [];
}

function resolvedName(p, isHome) {
  const roster = isHome ? _homeRoster : _awayRoster;
  const num = (p.number || '').toString().trim();
  const last = (p.last || p.name?.split(' ').pop() || '').toLowerCase();
  // Match by number first, then last name
  const match = roster.find(r => r.number?.toString().trim() === num) ||
                roster.find(r => r.name?.toLowerCase().includes(last));
  return match?.name || p.name || '';
}

function renderBatting(bsj, homeName, awayName) {
  const rows = bsj.batting || [];
  if (!rows.length) return '<div class="no-boxscore"><strong>No batting data</strong></div>';

  const homeRows = rows.filter(p => teamIs(p.team, homeName));
  const awayRows = rows.filter(p => teamIs(p.team, awayName));

  function playerRows(players, isHome) {
    return players.map(p => {
      const ba = p.ab > 0 ? f3(p.hits / p.ab) : '—';
      return `<tr>
        <td class="left player-name">${resolvedName(p, isHome)}${p.position ? `<span class="pos-tag">${p.position}</span>` : ''}</td>
        <td>${p.ab ?? 0}</td>
        <td class="${p.runs > 0 ? 'highlight' : ''}">${p.runs ?? 0}</td>
        <td class="${p.hits > 0 ? 'highlight' : ''}">${p.hits ?? 0}</td>
        <td class="${p.rbi > 0 ? 'highlight' : ''}">${p.rbi ?? 0}</td>
        <td>${p.bb ?? 0}</td>
        <td>${p.k_bat ?? 0}</td>
        <td>${p.doubles ?? 0}</td>
        <td>${p.triples ?? 0}</td>
        <td>${p.hr ?? 0}</td>
        <td>${p.sb ?? 0}</td>
        <td>${ba}</td>
      </tr>`;
    }).join('');
  }

  const thead = `<thead><tr>
    <th class="left">Player</th>
    <th>AB</th><th>R</th><th>H</th><th>RBI</th><th>BB</th><th>K</th>
    <th>2B</th><th>3B</th><th>HR</th><th>SB</th><th>AVG</th>
  </tr></thead>`;

  return `<table class="box" id="battingTable">
    ${thead}
    <tbody>
      <tr class="team-divider"><td colspan="12">${awayName} (Away)</td></tr>
      ${playerRows(awayRows, false)}
      <tr class="team-divider"><td colspan="12">${homeName} (Home)</td></tr>
      ${playerRows(homeRows, true)}
    </tbody>
  </table>`;
}

function renderPitching(bsj, homeName, awayName) {
  const rows = bsj.pitching || [];
  if (!rows.length) return '<div class="no-boxscore"><strong>No pitching data</strong></div>';

  const homeRows = rows.filter(p => teamIs(p.team, homeName));
  const awayRows = rows.filter(p => teamIs(p.team, awayName));

  function playerRows(players, isHome) {
    return players.map(p => {
      const ip = p.ip_outs != null ? `${Math.floor(p.ip_outs/3)}.${p.ip_outs%3}` : '—';
      const era = p.ip_outs > 0 ? f1((p.p_er * 27) / p.ip_outs) : '—';
      const dec = p.w ? `<span class="w-tag">W</span>` : p.l ? `<span class="l-tag">L</span>` : '';
      return `<tr>
        <td class="left player-name">${resolvedName(p, isHome)}${dec}</td>
        <td>${ip}</td>
        <td>${p.p_h ?? 0}</td>
        <td class="${p.p_er > 0 ? '' : 'highlight'}">${p.p_er ?? 0}</td>
        <td>${p.p_bb ?? 0}</td>
        <td class="${p.k > 5 ? 'highlight' : ''}">${p.k ?? 0}</td>
        <td>${era}</td>
      </tr>`;
    }).join('');
  }

  const thead = `<thead><tr>
    <th class="left">Pitcher</th>
    <th>IP</th><th>H</th><th>ER</th><th>BB</th><th>K</th><th>ERA</th>
  </tr></thead>`;

  return `<table class="box" id="pitchingTable">
    ${thead}
    <tbody>
      <tr class="team-divider"><td colspan="7">${awayName} (Away)</td></tr>
      ${playerRows(awayRows, false)}
      <tr class="team-divider"><td colspan="7">${homeName} (Home)</td></tr>
      ${playerRows(homeRows, true)}
    </tbody>
  </table>`;
}

let activeTab = 'batting';
function showBoxTab(tab, btn) {
  activeTab = tab;
  document.querySelectorAll('.sec-tab').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  const bsj = window._bsj;
  if (!bsj) return;
  document.getElementById('boxContent').innerHTML = tab === 'batting'
    ? renderBatting(bsj, window._htName, window._atName)
    : renderPitching(bsj, window._htName, window._atName);
}

function teamIs(teamName, schoolName) {
  if (!teamName || !schoolName) return false;
  const tn = teamName.toLowerCase();
  const sn = schoolName.toLowerCase();
  return tn.includes(sn) || sn.includes(tn) ||
    sn.split(' ').some(w => w.length > 3 && tn.includes(w));
}

// ── SEASON CONTEXT ───────────────────────────────────
async function loadTeamContext(g, ht, at, hSnap, aSnap, hRankLabel, aRankLabel) {
  // Load both teams' games to compute record at time of this game
  const [hGames, aGames] = await Promise.all([
    api(`games?or=(home_team_id.eq.${g.home_team_id},away_team_id.eq.${g.home_team_id})&sport_id=eq.${g.sport_id}&season_year=eq.2026&status=eq.final&select=id,game_date,home_team_id,home_score,away_score&order=game_date.asc`),
    api(`games?or=(home_team_id.eq.${g.away_team_id},away_team_id.eq.${g.away_team_id})&sport_id=eq.${g.sport_id}&season_year=eq.2026&status=eq.final&select=id,game_date,home_team_id,home_score,away_score&order=game_date.asc`)
  ]);

  function recordAtDate(games, teamId, beforeDate) {
    let w = 0, l = 0;
    (games || []).forEach(gm => {
      if (gm.game_date >= beforeDate) return;
      const ih = gm.home_team_id === teamId;
      const ms = ih ? gm.home_score : gm.away_score;
      const os = ih ? gm.away_score : gm.home_score;
      if (ms > os) w++; else l++;
    });
    return { w, l };
  }

  const hRec = recordAtDate(hGames, g.home_team_id, g.game_date);
  const aRec = recordAtDate(aGames, g.away_team_id, g.game_date);

  // Full season record
  const hFull = recordAtDate(hGames, g.home_team_id, '9999-99-99');
  const aFull = recordAtDate(aGames, g.away_team_id, '9999-99-99');

  document.getElementById('teamContext').innerHTML = `
    <div class="tc-card">
      <div class="tc-head">
        ${logoEl(at.logo_url, at.school_name, 28)}
        ${at.school_name}
      </div>
      <div class="tc-body">
        <div class="tc-row">
          <span class="lbl">Record entering game</span>
          <span class="val">${aRec.w}–${aRec.l}</span>
        </div>
        <div class="tc-row">
          <span class="lbl">Season record</span>
          <span class="val">${aFull.w}–${aFull.l}</span>
        </div>
        ${aRankLabel ? `<div class="tc-row">
          <span class="lbl">State rank (pre-game)</span>
          <span class="val grn">${aRankLabel}</span>
        </div>` : ''}
        ${aSnap.dirigo != null ? `<div class="tc-row">
          <span class="lbl">DIRIGO</span>
          <span class="val grn">${(+aSnap.dirigo).toFixed(2)}</span>
        </div>` : ''}
      </div>
    </div>
    <div class="tc-card">
      <div class="tc-head">
        ${logoEl(ht.logo_url, ht.school_name, 28)}
        ${ht.school_name}
      </div>
      <div class="tc-body">
        <div class="tc-row">
          <span class="lbl">Record entering game</span>
          <span class="val">${hRec.w}–${hRec.l}</span>
        </div>
        <div class="tc-row">
          <span class="lbl">Season record</span>
          <span class="val">${hFull.w}–${hFull.l}</span>
        </div>
        ${hRankLabel ? `<div class="tc-row">
          <span class="lbl">State rank (pre-game)</span>
          <span class="val grn">${hRankLabel}</span>
        </div>` : ''}
        ${hSnap.dirigo != null ? `<div class="tc-row">
          <span class="lbl">DIRIGO</span>
          <span class="val grn">${(+hSnap.dirigo).toFixed(2)}</span>
        </div>` : ''}
      </div>
    </div>`;
}

init();
