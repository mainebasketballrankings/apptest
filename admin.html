<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MBR Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Barlow', sans-serif; background: #f4f5f7; color: #111; min-height: 100vh; }

    .topbar {
      background: #fff;
      border-bottom: 2px solid #1a7a4a;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .topbar-title { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700; color: #1a7a4a; letter-spacing: 0.5px; }
    .topbar-sub { font-size: 12px; color: #888; margin-top: 1px; }

    .main { max-width: 860px; margin: 32px auto; padding: 0 16px; }

    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
      padding: 24px;
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .card-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 18px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .btn {
      font-family: 'Barlow', sans-serif;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid #ddd;
      background: #fff;
      cursor: pointer;
      color: #555;
    }
    .btn:hover { background: #f4f5f7; }
    .btn-green { background: #1a7a4a; color: #fff; border-color: #1a7a4a; }
    .btn-green:hover { background: #166040; }

    .hint { font-size: 11px; color: #aaa; margin-bottom: 16px; line-height: 1.5; }

    .row {
      display: grid;
      grid-template-columns: 82px 1fr 64px 160px 52px 90px;
      gap: 8px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
      font-size: 13px;
    }
    .row:last-child { border-bottom: none; }

    .state { padding: 32px 0; text-align: center; color: #aaa; font-size: 14px; }
    .state.error { color: #ef4444; }

    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid #ddd;
      border-top-color: #1a7a4a;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="topbar-title">MBR Admin</div>
    <div class="topbar-sub">Late score tracker</div>
  </div>
</div>

<div class="main">
  <div class="card">
    <div class="card-header">
      <div class="card-title">Late Scores</div>
      <div style="display:flex;gap:8px">
        <button class="btn" onclick="clearDismissed()">Reset dismissed</button>
        <button class="btn btn-green" onclick="reload()">↻ Refresh</button>
      </div>
    </div>
    <div class="hint">
      Scores entered manually in index — not through a push script run. Push runs touch many games at the same timestamp; manual entries don't. Basketball excluded. Last 30 days.
    </div>
    <div id="list"><div class="state"><span class="spinner"></span> Loading…</div></div>
  </div>
</div>

<script>
  const SB_URL = 'https://vtwupenqieesoktonbzg.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ0d3VwZW5xaWVlc29rdG9uYnpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0MTA0MzgsImV4cCI6MjA4Nzk4NjQzOH0.OqkqF7NXr5LBQsQ0sl6S2o-kzQqbtBlRCLFszRnUoHA';
  const BASKETBALL_ID = 'b31ab283-b28e-4ba8-9684-b1cf30cea219';
  const LOOKBACK_DAYS = 30;

  const sb = supabase.createClient(SB_URL, SB_KEY);

  // Detect push runs by grouping updated_at by minute.
  // Any minute with more than PUSH_THRESHOLD games = push script, not manual entry.

  function getDismissed() {
    return new Set(JSON.parse(localStorage.getItem('mbr_late_dismissed') || '[]'));
  }

  function dismiss(id) {
    const s = getDismissed();
    s.add(id);
    localStorage.setItem('mbr_late_dismissed', JSON.stringify([...s]));
    const el = document.getElementById('row-' + id);
    if (el) el.remove();
    if (!document.querySelectorAll('[id^="row-"]').length) {
      document.getElementById('list').innerHTML = '<div class="state">All caught up.</div>';
    }
  }

  function clearDismissed() {
    localStorage.removeItem('mbr_late_dismissed');
    reload();
  }

  function reload() {
    document.getElementById('list').innerHTML = '<div class="state"><span class="spinner"></span> Loading…</div>';
    load();
  }

  async function load() {
    const lookbackDate = new Date();
    lookbackDate.setDate(lookbackDate.getDate() - LOOKBACK_DAYS);
    const lookbackISO = lookbackDate.toISOString().slice(0, 10);

    const { data: games, error } = await sb
      .from('games')
      .select('id, game_date, home_score, away_score, updated_at, sport_id, home_team:home_team_id(school_name, gender), away_team:away_team_id(school_name), sport:sport_id(name)')
      .eq('status', 'final')
      .eq('season_year', 2026)
      .gte('game_date', lookbackISO)
      .neq('sport_id', BASKETBALL_ID)
      .order('updated_at', { ascending: false })
      .limit(500);

    if (error) {
      document.getElementById('list').innerHTML = '<div class="state error">Error: ' + error.message + '</div>';
      return;
    }

    const dis = getDismissed();

    // Detect push runs: group updated_at by minute — any minute with >5 games is a push script
    // Manual entries in index.html happen 1-2 at a time, never dozens simultaneously
    const byMinute = {};
    for (const g of (games || [])) {
      if (!g.updated_at) continue;
      const minute = g.updated_at.slice(0, 16); // "2026-05-15T23:37"
      if (!byMinute[minute]) byMinute[minute] = 0;
      byMinute[minute]++;
    }
    const PUSH_THRESHOLD = 5; // minutes with more than this many games = push run

    // Debug: log the minute buckets so we can see what's a push vs manual
    console.log('[admin] total games fetched:', (games||[]).length);
    console.log('[admin] minute buckets:', Object.entries(byMinute).sort((a,b) => b[1]-a[1]).slice(0,20).map(([m,n]) => m + ' → ' + n).join('\n'));

    const late = (games || []).filter(g => {
      if (!g.updated_at || !g.game_date) return false;
      if (dis.has(g.id)) return false;
      if (g.home_score === null || g.away_score === null) return false;
      const minute = g.updated_at.slice(0, 16);
      return byMinute[minute] <= PUSH_THRESHOLD; // not a push run
    });

    if (!late.length) {
      document.getElementById('list').innerHTML = '<div class="state">No late scores in the last ' + LOOKBACK_DAYS + ' days.</div>';
      return;
    }

    const rows = late.map(g => {
      const updated   = new Date(g.updated_at);
      const gameDay   = new Date(g.game_date + 'T12:00:00Z');
      const daysAfter = (updated - gameDay) / 86400000;
      const lateLabel = daysAfter < 1 ? 'same day' : '+' + Math.floor(daysAfter) + 'd';
      const lateColor = daysAfter >= 7 ? '#ef4444' : daysAfter >= 3 ? '#f59e0b' : '#6b7280';
      const sportName = g.sport?.name || '';
      const gender    = g.home_team?.gender || '';
      const sport     = ['Lacrosse','Soccer','Field Hockey','Volleyball'].includes(sportName) && gender ? gender + ' ' + sportName : sportName;
      const score     = g.home_score + '–' + g.away_score;
      const entered   = updated.toLocaleDateString('en-US', {month:'short',day:'numeric'}) + ' ' + updated.toLocaleTimeString('en-US', {hour:'numeric',minute:'2-digit'});

      return '<div class="row" id="row-' + g.id + '">'
        + '<div style="color:#888;font-size:12px">' + g.game_date + '</div>'
        + '<div><strong>' + (g.home_team?.school_name||'?') + '</strong> vs <strong>' + (g.away_team?.school_name||'?') + '</strong><br><span style="color:#aaa;font-size:11px">' + sport + '</span></div>'
        + '<div style="font-weight:700">' + score + '</div>'
        + '<div style="color:#888;font-size:11px">' + entered + '</div>'
        + '<div style="color:' + lateColor + ';font-weight:700;font-size:12px">' + lateLabel + '</div>'
        + '<button class="btn btn-green" onclick="dismiss(\'' + g.id + '\')">✓ Got it</button>'
        + '</div>';
    }).join('');

    document.getElementById('list').innerHTML =
      '<div style="font-size:12px;color:#888;margin-bottom:12px">' + late.length + ' score' + (late.length !== 1 ? 's' : '') + ' to add to Excel</div>'
      + rows;
  }

  load();
</script>
</body>
</html>
