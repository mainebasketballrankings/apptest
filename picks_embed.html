<!-- Maine Basketball Rankings — Nightly Picks. Paste into a Ghost HTML card. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<div id="mbr-picks">
  <style>
    #mbr-picks{--ink:#111;--mute:#8a8a8a;--line:#e6e6e6;--soft:#f6f6f6;--win:#1f8a4c;--loss:#c0392b;
      font:16px/1.45 Barlow,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);max-width:1100px;margin:0 auto}
    #mbr-picks *{box-sizing:border-box}
    #mbr-picks .cd{font-family:"Barlow Condensed","Arial Narrow",sans-serif}
    #mbr-picks h2.pk-title{font:800 46px/1 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:-.5px;margin:0 0 6px;text-transform:none}
    #mbr-picks .pk-sub{color:var(--mute);font-size:19px;margin:0 0 22px}
    /* sport-style tabs */
    #mbr-picks .gtabs{display:flex;gap:30px;border-bottom:1px solid var(--line);margin-bottom:22px}
    #mbr-picks .gtabs button{background:none;border:0;border-bottom:3px solid transparent;padding:0 0 8px;margin-bottom:-1px;cursor:pointer;
      font:700 24px/1 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.6px;text-transform:uppercase;color:#a3a3a3}
    #mbr-picks .gtabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
    /* pill buttons */
    #mbr-picks .row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
    #mbr-picks .pills{display:flex;gap:10px;flex-wrap:wrap}
    #mbr-picks .pill{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:9px 18px;cursor:pointer;
      font:700 17px/1 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.7px;text-transform:uppercase;color:#333}
    #mbr-picks .pill.on{background:var(--ink);border-color:var(--ink);color:#fff}
    #mbr-picks .pill.sm{padding:7px 12px;font-size:15px}
    #mbr-picks .meta-r{font:600 15px/1 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.8px;text-transform:uppercase;color:var(--mute)}
    /* cards */
    #mbr-picks .card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;margin-bottom:16px}
    #mbr-picks .card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--soft);border-bottom:1px solid var(--line);padding:14px 20px}
    #mbr-picks .card-h h3{margin:0;font:700 21px/1 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:1.2px;text-transform:uppercase}
    #mbr-picks .card-h .nav{display:flex;align-items:center;gap:10px}
    #mbr-picks .card-b{padding:6px 20px 14px}
    #mbr-picks .card-f{padding:12px 20px 16px;color:var(--mute);font-size:15px;border-top:1px solid var(--line)}
    #mbr-picks .note{padding:14px 0;color:#555}
    #mbr-picks .note a{color:var(--ink);font-weight:700}
    #mbr-picks .note input{padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;font:500 16px Barlow,sans-serif;width:220px;max-width:100%;margin:6px 8px 0 0}
    #mbr-picks .status{min-height:22px;font-size:14px;color:var(--mute);padding-top:10px}
    #mbr-picks .err{color:var(--loss)}
    /* games */
    #mbr-picks .game{display:grid;grid-template-columns:34px 1fr 1fr;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
    #mbr-picks .game:last-child{border-bottom:0}
    #mbr-picks .rk{font:700 18px/1 "Barlow Condensed","Arial Narrow",sans-serif;color:var(--mute)}
    #mbr-picks .team{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:8px;padding:9px 12px;background:#fff;
      cursor:pointer;text-align:left;font:inherit;color:inherit;min-height:52px;width:100%}
    #mbr-picks .team img{width:30px;height:30px;object-fit:contain;flex:none}
    #mbr-picks .team .nm{flex:1;font-weight:600;font-size:17px;line-height:1.15}
    #mbr-picks .team .nm small{display:block;font:600 12px/1.2 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.8px;text-transform:uppercase;color:var(--mute)}
    #mbr-picks .team .sc{font:700 22px/1 "Barlow Condensed","Arial Narrow",sans-serif}
    #mbr-picks .team.sel{border:2px solid var(--ink);background:var(--soft)}
    #mbr-picks .team[disabled]{cursor:default}
    #mbr-picks .team.won .sc{color:var(--ink)}
    #mbr-picks .team.lost .sc{color:#b5b5b5}
    #mbr-picks .gfoot{grid-column:2 / 4;display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;color:var(--mute);margin-top:-2px}
    #mbr-picks .ok{color:var(--win);font-weight:700}
    #mbr-picks .no{color:var(--loss);font-weight:700}
    /* leaderboard */
    #mbr-picks table{width:100%;border-collapse:collapse}
    #mbr-picks th{font:700 15px/1 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:1px;text-transform:uppercase;color:#555;padding:14px 8px;text-align:right;border-bottom:1px solid var(--line)}
    #mbr-picks td{padding:14px 8px;text-align:right;border-bottom:1px solid var(--line);font:600 20px/1 "Barlow Condensed","Arial Narrow",sans-serif}
    #mbr-picks th:nth-child(2),#mbr-picks td:nth-child(2){text-align:left}
    #mbr-picks td:nth-child(2){font:600 18px/1.2 Barlow,sans-serif}
    #mbr-picks td:first-child,#mbr-picks th:first-child{width:44px;text-align:left}
    #mbr-picks tr.cut td{border-bottom:2.5px solid var(--ink)}
    #mbr-picks tr.model td{font-weight:800}
    #mbr-picks tr.model td:nth-child(2){font-weight:700}
    #mbr-picks tr.me td{background:var(--soft)}
    #mbr-picks tr.unq td{color:#9a9a9a}
    #mbr-picks .tag{font:700 12px/1 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.8px;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:3px 5px;margin-left:8px;color:var(--mute);vertical-align:2px}
    @media (max-width:600px){
      #mbr-picks h2.pk-title{font-size:36px} #mbr-picks .pk-sub{font-size:16px}
      #mbr-picks .game{grid-template-columns:24px 1fr 1fr;gap:6px} #mbr-picks .team{padding:8px} #mbr-picks .team img{width:24px;height:24px}
      #mbr-picks .team .nm{font-size:15px} #mbr-picks .card-h,#mbr-picks .card-b,#mbr-picks .card-f{padding-left:12px;padding-right:12px}
    }
  </style>

  <h2 class="pk-title">Nightly Picks</h2>
  <p class="pk-sub">Basketball · Pick winners from tonight's 10 biggest games. Best season W-L % wins.</p>
  <div class="gtabs"><button data-gender="Boys" class="on">Boys</button><button data-gender="Girls">Girls</button></div>
  <div class="row">
    <div class="pills"><button class="pill on" data-tab="slate">Tonight's Slate</button><button class="pill" data-tab="board">Leaderboard</button></div>
    <div class="meta-r" id="pk-meta"></div>
  </div>
  <div id="pk-body"></div>
</div>

<script>
(() => {
  const SB = 'https://vtwupenqieesoktonbzg.supabase.co';
  const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ0d3VwZW5xaWVlc29rdG9uYnpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0MTA0MzgsImV4cCI6MjA4Nzk4NjQzOH0.OqkqF7NXr5LBQsQ0sl6S2o-kzQqbtBlRCLFszRnUoHA';
  const root = document.getElementById('mbr-picks');
  const body = root.querySelector('#pk-body');
  const meta = root.querySelector('#pk-meta');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const etDate = d => new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York' }).format(d);
  const addDays = (s, n) => { const d = new Date(s + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
  const niceDate = s => new Date(s + 'T12:00:00Z').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' });
  const niceTime = t => new Date(t).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'America/New_York' });
  const pct = p => p == null ? '—' : Number(p).toFixed(3).replace(/^0/, '');

  const today = etDate(new Date());
  const st = { tab: 'slate', gender: 'Boys', date: today, slate: [], me: null, picks: {}, signedIn: null, msg: '', boardNight: false };
  const pickedHere = () => st.slate.filter(g => st.picks[g.game_id]).length;

  async function rpc(fn, args) {
    const r = await fetch(`${SB}/rest/v1/rpc/${fn}`, { method: 'POST',
      headers: { apikey: KEY, Authorization: `Bearer ${KEY}`, 'Content-Type': 'application/json' }, body: JSON.stringify(args) });
    const j = await r.json().catch(() => null);
    if (!r.ok) throw new Error((j && j.message) || 'Could not load');
    return j;
  }
  async function ghostToken() {
    try { const r = await fetch('/members/api/session/', { credentials: 'same-origin' });
      return r.status === 200 ? (await r.text()).trim() : ''; } catch { return ''; }
  }
  async function api(payload) {
    const token = await ghostToken();
    if (!token) { st.signedIn = false; throw new Error('Sign in to make picks.'); }
    const r = await fetch(`${SB}/functions/v1/picks`, { method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-ghost-token': token, apikey: KEY }, body: JSON.stringify(payload) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Something went wrong');
    return j;
  }

  async function loadSlate() {
    body.innerHTML = `<div class="card"><div class="card-b"><div class="note">Loading…</div></div></div>`;
    try {
      st.slate = await rpc('mbr_picks_slate', { p_date: st.date, p_gender: st.gender });
      st.picks = {}; st.me = null;
      const token = await ghostToken();
      st.signedIn = !!token;
      if (token) {
        try { const m = await api({ action: 'me', date: st.date }); st.me = m.display_name; st.picks = m.picks || {}; }
        catch (e) { st.msg = `<span class="err">${esc(e.message)}</span>`; }
      }
    } catch (e) { st.slate = []; st.msg = `<span class="err">${esc(e.message)}</span>`; }
    render();
  }

  async function pick(gameId, teamId) {
    const cur = st.picks[gameId];
    const next = cur === teamId ? null : teamId;            // tap again to clear
    if (next) st.picks[gameId] = next; else delete st.picks[gameId];
    st.msg = 'Saving…'; render();
    try {
      const r = await api({ action: 'submit', date: st.date, picks: [{ game_id: gameId, team_id: next }] });
      st.picks = r.picks || {};
      st.msg = r.skipped ? '<span class="err">That game is locked.</span>' : `Saved · ${pickedHere()} of ${st.slate.length} picked`;
    } catch (e) { st.msg = `<span class="err">${esc(e.message)}</span>`; if (cur) st.picks[gameId] = cur; else delete st.picks[gameId]; }
    render();
  }

  async function saveName() {
    const v = root.querySelector('#pk-name').value;
    st.msg = 'Saving…'; render();
    try { const r = await api({ action: 'set_name', name: v }); st.me = r.display_name; st.msg = `You're in as <b>${esc(st.me)}</b>.`; }
    catch (e) { st.msg = `<span class="err">${esc(e.message)}</span>`; }
    render();
  }

  function slateHtml() {
    const s = st.slate;
    const frozen = s.length && s[0].frozen, locked = s.length && s[0].locked, lockAt = s.length ? s[0].lock_at : null;
    meta.textContent = !s.length ? '' : locked ? 'Picks locked' : frozen ? `Picks lock ${niceTime(lockAt)}` : `Opens on game day`;
    const canPick = frozen && !locked && st.signedIn && st.me;

    let h = `<div class="card"><div class="card-h"><h3>${esc(st.gender)} — ${niceDate(st.date)}${st.date === today ? ' · Tonight' : ''}</h3>
      <div class="nav"><button class="pill sm" data-nav="-1" aria-label="Previous day">‹</button><button class="pill sm" data-nav="1" aria-label="Next day">›</button></div></div><div class="card-b">`;

    if (frozen && !locked) {
      if (st.signedIn === false) h += `<div class="note"><a href="#/portal/signin">Sign in</a> (free) to make your picks.</div>`;
      else if (st.signedIn && !st.me) h += `<div class="note">Choose a display name for the leaderboard:<br>
        <input id="pk-name" maxlength="24" placeholder="e.g. Downeast Hoops"><button class="pill on" data-act="name">Save</button></div>`;
    }
    h += `<div class="status">${st.msg || ''}</div>`;
    if (!s.length) h += `<div class="note">No ${st.gender.toLowerCase()} games on the slate this day.</div>`;

    for (const g of s) {
      const mine = st.picks[g.game_id];
      const winner = g.final ? (g.home_score > g.away_score ? g.home_id : g.away_id) : null;
      const side = (id, name, logo, score) => `
        <button class="team ${mine === id ? 'sel' : ''} ${winner ? (winner === id ? 'won' : 'lost') : ''}" ${canPick ? '' : 'disabled'} data-g="${g.game_id}" data-t="${id}">
          ${logo ? `<img src="${esc(logo)}" alt="" loading="lazy">` : ''}
          <span class="nm">${esc(name)}<small>${id === g.home_id ? 'Home' : 'Away'}</small></span>
          ${g.final ? `<span class="sc">${score}</span>` : ''}
        </button>`;
      const foot = [];
      if (mine && winner) foot.push(mine === winner ? '<span class="ok">✓ Your pick won</span>' : '<span class="no">✗ Your pick lost</span>');
      else if (mine && g.locked) foot.push('Your pick is in');
      if (g.locked && g.model_team_id) foot.push(`Model: <b>${esc(g.model_team_id === g.home_id ? g.home_name : g.away_name)}</b>${winner ? (g.model_team_id === winner ? ' ✓' : ' ✗') : ''}`);
      if (g.locked && g.picks_count) foot.push(`Picks: ${esc(g.away_name)} ${100 - g.home_pick_pct}% · ${esc(g.home_name)} ${g.home_pick_pct}%`);
      h += `<div class="game"><span class="rk">${g.slate_rank}</span>
        ${side(g.away_id, g.away_name, g.away_logo, g.away_score)}${side(g.home_id, g.home_name, g.home_logo, g.home_score)}
        ${foot.length ? `<div class="gfoot">${foot.join('<span>·</span>')}</div>` : ''}</div>`;
    }
    h += `</div><div class="card-f">Pick as many of the ${s.length || 10} games as you like. Picks lock at 5 PM on weeknights and 10 AM on weekends.
      The Model's picks and the crowd split appear once picks lock.</div></div>`;
    return h;
  }

  async function boardHtml() {
    meta.textContent = '';
    const rows = await rpc('mbr_picks_leaderboard', { p_gender: st.gender, p_date: st.boardNight ? st.date : null });
    const need = rows[0] ? rows[0].min_picks : 0, graded = rows[0] ? rows[0].graded_games : 0;
    meta.textContent = st.boardNight ? `${graded} games graded` : `${graded} games graded · ${need} picks to qualify`;
    let h = `<div class="card"><div class="card-h"><h3>${esc(st.gender)} — ${st.boardNight ? niceDate(st.date) : 'Season Standings'}</h3>
      <div class="nav"><button class="pill sm ${!st.boardNight ? 'on' : ''}" data-board="season">Season</button><button class="pill sm ${st.boardNight ? 'on' : ''}" data-board="night">Night</button></div></div><div class="card-b">`;
    if (!rows.length || !graded) return h + `<div class="note">No graded games yet.</div></div></div>`;
    h += `<table><thead><tr><th>#</th><th>Player</th><th>W-L</th><th>Pct</th></tr></thead><tbody>`;
    const firstUnq = st.boardNight ? -1 : rows.findIndex(r => !r.qualified);
    rows.forEach((r, i) => {
      const cls = [r.is_model ? 'model' : '', st.me && r.display_name === st.me ? 'me' : '',
        !st.boardNight && !r.qualified ? 'unq' : '', i === firstUnq - 1 ? 'cut' : ''].join(' ');
      h += `<tr class="${cls}"><td>${!st.boardNight && !r.qualified ? '—' : r.rank}</td>
        <td>${esc(r.display_name)}${r.is_model ? '<span class="tag">Model</span>' : ''}</td>
        <td>${r.wins}-${r.losses}</td><td>${pct(r.pct)}</td></tr>`;
    });
    h += `</tbody></table></div><div class="card-f">${st.boardNight ? 'Results from one night\'s slate.'
      : `Ranked by W-L %. Players need picks on 25% of graded slate games (${need} right now) to qualify — everyone below the line is still building up picks.`}</div></div>`;
    return h;
  }

  async function render() {
    root.querySelectorAll('.gtabs button').forEach(b => b.classList.toggle('on', b.dataset.gender === st.gender));
    root.querySelectorAll('.row .pill[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === st.tab));
    if (st.tab === 'slate') body.innerHTML = slateHtml();
    else { try { body.innerHTML = await boardHtml(); } catch (e) { body.innerHTML = `<div class="card"><div class="card-b"><div class="note err">${esc(e.message)}</div></div></div>`; } }
  }

  root.addEventListener('click', e => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.tab) { st.tab = t.dataset.tab; st.msg = ''; st.tab === 'slate' ? loadSlate() : render(); }
    else if (t.dataset.gender) { st.gender = t.dataset.gender; st.msg = ''; st.tab === 'slate' ? loadSlate() : render(); }
    else if (t.dataset.nav) { st.date = addDays(st.date, +t.dataset.nav); st.msg = ''; loadSlate(); }
    else if (t.dataset.board) { st.boardNight = t.dataset.board === 'night'; render(); }
    else if (t.dataset.act === 'name') saveName();
    else if (t.dataset.g && !t.disabled) pick(t.dataset.g, t.dataset.t);
  });

  loadSlate();
})();
</script>
