<style>
  :root{
    --ink:#111; --gray:#555; --lgray:#999; --border:#e2e2e2; --rule:#ebebeb;
    --paper:#fff; --paper2:#f5f5f5; --green:#15803d; --red:#b91c1c; --blue:#1d4ed8;

  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{overflow-x:hidden}
  body{font-family:'Barlow',sans-serif;background:var(--paper);color:var(--ink)}
  .page{max-width:1180px;margin:0 auto;padding:24px 16px 60px}
  .cond{font-family:'Barlow Condensed',sans-serif}
  .title{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:30px;line-height:1.05}
  .sub{font-size:14px;color:var(--lgray);margin:2px 0 18px}

  .region-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .region-btn{background:#fff;border:1.5px solid var(--border);border-radius:6px;color:var(--gray);cursor:pointer;
    font:700 12px 'Barlow Condensed',sans-serif;letter-spacing:.04em;padding:5px 12px;text-transform:uppercase}
  .region-btn:hover{border-color:#999;color:var(--ink)}
  .region-btn.active{background:var(--ink);border-color:var(--ink);color:#fff}

  .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .bar label{font:700 11px 'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--gray)}
  select{background:#fff;border:1.5px solid var(--border);border-radius:6px;font:600 13px 'Barlow',sans-serif;padding:6px 10px;color:var(--ink)}
  .spacer{flex:1}
  .btn{border:1.5px solid var(--ink);background:var(--ink);color:#fff;border-radius:6px;cursor:pointer;
    font:700 13px 'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:7px 14px}
  .btn.ghost{background:#fff;color:var(--ink);border-color:var(--border)}
  .btn:disabled{opacity:.4;cursor:default}

  .layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}

  .hero.on{display:block}
  .hero-team{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .hero-team img{width:38px;height:38px;object-fit:contain}
  .hero-team .nm{font:700 22px 'Barlow Condensed',sans-serif}
  .hero-team .rec{font:600 13px 'Barlow',sans-serif;color:var(--lgray)}

  .game .at{font:600 11px 'Barlow Condensed',sans-serif;color:var(--lgray);text-align:center}

<script>
// ═══ Playoff calculator engine (football / Crabtree) ═══════════════════════
// A line-for-line port of simulate_fall.py's football path:
//   crabtree = (own win% + opponents' combined win%) * 100
//   one entry per meeting, NH opponents padded with their known out-of-state
//   record plus coin flips for the rest of their season, ranked within region,
//   top IN make it, top BYE get a bye.
// Picks simply pin a game's home-win probability to 1 or 0.
const PCEngine = (() => {

  function regionKey(t) {
    const c = (t.team_class || '').trim();
    if (!c || c === 'ALL') return null;
    const cls = c.replace(/^8\s*(Large|Small)$/i, (m, s) => '8 ' + s[0].toUpperCase() + s.slice(1).toLowerCase());
    return t.team_region ? `${cls} ${t.team_region}` : cls;
  }

  // Deterministic RNG so the same picks always give the same numbers (and a
  // shared link shows exactly what the sharer saw).
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // teams: [{id, school_name, team_class, team_region}]
  // games: [{id, home_team_id, away_team_id, status, home_score, away_score, win_prob}]
  // cfg:   {slots: {region: {in, bye}}, nh_total, nh: {name: {wins, losses}}}
  function build(teams, games, cfg) {
    const byId = new Map(teams.map(t => [t.id, t]));
    const idx = new Map(); const list = [];
    const add = id => { if (!idx.has(id)) { idx.set(id, list.length); list.push(byId.get(id)); } return idx.get(id); };

    const ranked = new Set(teams.filter(t => regionKey(t)).map(t => t.id));
    // Same filter as the Python: games between known teams, plus games against
    // out-of-state teams that play a known team. User-created placeholder teams
    // (not in `teams`) drop out here.
    const usable = games.filter(g => byId.has(g.home_team_id) && byId.has(g.away_team_id)
      && (ranked.has(g.home_team_id) || ranked.has(g.away_team_id)));

    // Fix the team order so ranked teams come first in a stable order.
    teams.filter(t => ranked.has(t.id)).forEach(t => add(t.id));
    usable.forEach(g => { add(g.home_team_id); add(g.away_team_id); });
    const N = list.length;

    const baseW = new Float64Array(N), baseL = new Float64Array(N), played = new Float64Array(N);
    const opps = Array.from({ length: N }, () => []);
    const done = [], sched = [];
    for (const g of usable) {
      const h = idx.get(g.home_team_id), a = idx.get(g.away_team_id);
      opps[h].push(a); opps[a].push(h);
      played[h]++; played[a]++;
      const final = g.status === 'final' && g.home_score != null && g.away_score != null;
      if (final) {
        const hw = +g.home_score > +g.away_score;          // matches the Python (tie = away)
        if (hw) { baseW[h]++; baseL[a]++; } else { baseW[a]++; baseL[h]++; }
        done.push(g.id);
      } else {
        const p = g.win_prob == null || isNaN(+g.win_prob) ? 0.5 : Math.min(1, Math.max(0, +g.win_prob));
        sched.push({ id: g.id, h, a, p, date: g.game_date });
      }
    }

    // Out-of-state padding
    const nh = [];
    const vsMaine = new Map();
    for (const g of usable) for (const [x, y] of [[g.home_team_id, g.away_team_id], [g.away_team_id, g.home_team_id]])
      if (!ranked.has(x) && ranked.has(y)) vsMaine.set(x, (vsMaine.get(x) || 0) + 1);
    const nhTotal = cfg.nh_total || 9;
    for (const [name, rec] of Object.entries(cfg.nh || {})) {
      const t = teams.find(x => x.school_name === name);
      if (!t || !vsMaine.has(t.id)) continue;
      const kw = +rec.wins || 0, known = kw + (+rec.losses || 0);
      const unknown = Math.max(0, nhTotal - vsMaine.get(t.id) - known);
      const i = idx.get(t.id);
      baseW[i] += kw; played[i] += known + unknown;
      nh.push({ i, unknown });
    }

    const rankedIdx = list.map((t, i) => ranked.has(t.id) ? i : -1).filter(i => i >= 0);
    const regionOf = new Map(rankedIdx.map(i => [i, regionKey(list[i])]));
    const regions = {};
    for (const i of rankedIdx) (regions[regionOf.get(i)] ||= []).push(i);

    return { list, idx, N, baseW, baseL, played, opps, sched, nh, rankedIdx, regionOf, regions,
             slots: cfg.slots || {}, completed: done.length };
  }

  // picks: {gameId: 'h' | 'a'}
  function run(m, picks = {}, nSims = 10000, seed = 2027) {
    const rnd = mulberry32(seed);
    const { N, baseW, baseL, played, opps, sched, nh, rankedIdx, regions, slots } = m;
    const S = sched.length;
    const prob = new Float64Array(S);
    sched.forEach((g, k) => prob[k] = picks[g.id] === 'h' ? 1 : picks[g.id] === 'a' ? 0 : g.p);

    const rankCount = new Map(rankedIdx.map(i => [i, new Float64Array(20)]));
    const inCount = new Float64Array(N), byeCount = new Float64Array(N), ratingSum = new Float64Array(N);
    const wl = new Map(rankedIdx.map(i => [i, new Map()]));
    const W = new Float64Array(N), L = new Float64Array(N), crab = new Float64Array(N);

    for (let s = 0; s < nSims; s++) {
      W.set(baseW); L.set(baseL);
      for (let k = 0; k < S; k++) {
        const g = sched[k];
        if (rnd() < prob[k]) { W[g.h]++; L[g.a]++; } else { W[g.a]++; L[g.h]++; }
      }
      for (const n of nh) {
        let f = 0; for (let u = 0; u < n.unknown; u++) if (rnd() < 0.5) f++;
        W[n.i] += f;
      }
      for (const t of rankedIdx) {
        const p = played[t];
        if (!p) { crab[t] = 0; continue; }
        let ow = 0, op = 0;
        for (const o of opps[t]) { ow += W[o]; op += played[o]; }
        crab[t] = Math.round((W[t] / p + (op ? ow / op : 0)) * 100 * 1e4) / 1e4;
      }
      for (const reg in regions) {
        const arr = regions[reg].slice().sort((x, y) => crab[y] - crab[x]);
        const sl = slots[reg] || {}; const nin = sl.in ?? arr.length, nbye = sl.bye ?? 0;
        arr.forEach((t, r) => {
          rankCount.get(t)[r]++;
          if (r < nin) inCount[t]++;
          if (r < nbye) byeCount[t]++;
          ratingSum[t] += crab[t];
        });
      }
      for (const t of rankedIdx) {
        const key = `${W[t]}-${L[t]}`;
        const mm = wl.get(t); mm.set(key, (mm.get(key) || 0) + 1);
      }
    }

    const out = {};
    for (const t of rankedIdx) {
      const rc = rankCount.get(t);
      let avg = 0; for (let r = 0; r < 20; r++) avg += (r + 1) * rc[r];
      out[m.list[t].id] = {
        in: inCount[t] / nSims, bye: byeCount[t] / nSims,
        seeds: Array.from(rc, c => c / nSims),
        avgSeed: avg / nSims, rating: ratingSum[t] / nSims,
        wl: Object.fromEntries([...wl.get(t)].map(([k, v]) => [k, v / nSims])),
      };
    }
    return out;
  }

  return { build, run, regionKey };
})();
if (typeof module !== 'undefined') module.exports = PCEngine;

</script>

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = v => v >= 0.9995 ? '100%' : v < 0.0005 ? '—' : (v * 100).toFixed(v < 0.1 ? 1 : 0) + '%';
const pctFull = v => (v * 100).toFixed(1) + '%';
const fdt = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';

async function sb(path) {
  const out = [];
  for (let off = 0; ; off += 1000) {
    const r = await fetch(`${SB_URL}/rest/v1/${path}${path.includes('?') ? '&' : '?'}limit=1000&offset=${off}`,
      { headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}` } });
    if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
    const rows = await r.json(); out.push(...rows);
    if (rows.length < 1000) return out;
  }
}

  const q = new URLSearchParams(location.search || location.hash.slice(1));

    const [teams, games, cfgRows] = await Promise.all([
      sb(`teams?sport_id=eq.${SPORT_ID}&active=eq.true&owner_id=is.null&select=id,school_name,team_class,team_region,logo_url`),
      sb(`games?sport_id=eq.${SPORT_ID}&season_year=eq.${SEASON}&is_tournament=eq.false&select=id,home_team_id,away_team_id,home_score,away_score,status,win_prob,game_date&order=game_date.asc`),
      sb(`sim_config?key=eq.football_${SEASON}&select=value`),
    ]);
    CFG = cfgRows[0]?.value;
    if (!CFG) throw new Error('Calculator settings are missing (sim_config).');
    // Ties in the rankings fall back to the same team order the nightly run uses.
    const pos = new Map((CFG.order || []).map((n, i) => [n, i]));
    TEAMS = teams.filter(t => t.team_class !== 'ALL' && !/^zz test/i.test(t.school_name))
      .sort((a, b) => (pos.get(a.school_name) ?? 1e4) - (pos.get(b.school_name) ?? 1e4) || a.school_name.localeCompare(b.school_name));
    BY_ID = new Map(TEAMS.map(t => [t.id, t]));
    GAMES = games;
    M = PCEngine.build(TEAMS, GAMES, CFG);

    const s = readShared();
    const regions = Object.keys(M.regions).sort(regionSort);
    region = regions.includes(s.r) ? s.r : regions[0];
    if (s.t) { const t = TEAMS.find(x => shortId(x.id) === s.t); if (t) { myTeam = t.id; region = PCEngine.regionKey(t); } }
    if (s.p) {
      const map = new Map(M.sched.map(g => [shortId(g.id), g.id]));
      for (const tok of s.p.split('.')) {
        const id = map.get(tok.slice(0, 8)); const side = tok[8];
        if (id && (side === 'h' || side === 'a')) picks[id] = side;
      }
    }
    BASE = PCEngine.run(M, {}, SIMS);
    renderRegions(regions);
    renderTeamSelect();
    await recalc();
  } catch (e) {
    $('app').innerHTML = `<div class="state">Couldn't load the calculator. ${esc(e.message)}</div>`;
  }
}

function regionSort(a, b) {
  const rank = r => { const c = r.split(' ')[0]; return ({ A: 1, B: 2, C: 3, D: 4, '8': 5 })[c[0]] ?? 9; };
  return rank(a) - rank(b) || a.localeCompare(b);
}

function renderRegions(regions) {
  $('regionRow').innerHTML = regions.map(r => `<button class="region-btn${r === region ? ' active' : ''}" data-r="${esc(r)}">${esc(r)}</button>`).join('');
  $('regionRow').onclick = e => {
    const b = e.target.closest('.region-btn'); if (!b) return;
    region = b.dataset.r;
    if (myTeam && PCEngine.regionKey(BY_ID.get(myTeam)) !== region) myTeam = '';
    document.querySelectorAll('.region-btn').forEach(x => x.classList.toggle('active', x === b));
    renderTeamSelect(); render();
  };
}

function renderTeamSelect() {
  const ids = M.regions[region].map(i => M.list[i]).sort((a, b) => a.school_name.localeCompare(b.school_name));
  $('teamSel').innerHTML = '<option value="">— none —</option>' +
    ids.map(t => `<option value="${t.id}"${t.id === myTeam ? ' selected' : ''}>${esc(t.school_name)}</option>`).join('');
  $('teamSel').onchange = e => { myTeam = e.target.value; render(); };
}

// ── records ──────────────────────────────────────────────────────────────
function record(id) {
  const i = M.idx.get(id);
  return `${M.baseW[i]}-${M.baseL[i]}`;     // ranked teams never get out-of-state padding
}

// ── recalc (debounced, chunk-free: 10k sims ≈ 0.25s) ─────────────────────
let timer;
function schedule() { clearTimeout(timer); $('status') && $('status').classList.add('busy'); timer = setTimeout(recalc, 120); }
async function recalc() {
  const tok = ++runToken;
  if ($('status')) { $('status').classList.add('busy'); $('status').textContent = 'Simulating'; }
  await new Promise(r => setTimeout(r, 16));       // let the spinner paint
  const res = Object.keys(picks).length ? PCEngine.run(M, picks, SIMS) : BASE;
  if (tok !== runToken) return;
  CUR = res;
  render();
}

// ── render ───────────────────────────────────────────────────────────────
const logo = (t, cls = '') => t?.logo_url ? `<img class="${cls}" src="${esc(t.logo_url)}" alt="" loading="lazy" onerror="this.remove()">` : '';
function delta(now, was, invert = false) {
  const d = (now - was) * 100;
  if (Math.abs(d) < 0.5) return '';
  const good = invert ? d < 0 : d > 0;
  return `<span class="dl ${good ? 'up' : 'down'}">${d > 0 ? '▲' : '▼'}${Math.abs(d).toFixed(0)}</span>`;
}

function render() {
  const nPicks = Object.keys(picks).length;
  $('clearBtn').disabled = !nPicks;
  $('shareBtn').disabled = false;

  const regTeams = M.regions[region].map(i => M.list[i]);
  const slots = M.slots[region] || {};
  const nin = slots.in ?? regTeams.length, nbye = slots.bye ?? 0;
  const rows = regTeams.map(t => ({ t, r: CUR[t.id], b: BASE[t.id] }))
    .sort((x, y) => x.r.avgSeed - y.r.avgSeed);
  const seedCols = Math.min(regTeams.length, Math.max(nin, 4));
  const showBye = nbye > 0 && nbye < nin;

  let hero = '';
  if (myTeam) {
    const t = BY_ID.get(myTeam), r = CUR[myTeam], b = BASE[myTeam];
    const best = r.seeds.reduce((bi, v, i, a) => v > a[bi] ? i : bi, 0);
    hero = `<div class="hero on">
      <div class="hero-team">${logo(t)}<div><div class="nm">${esc(t.school_name)}</div><div class="rec">${record(t.id)} · ${esc(region)}</div></div></div>
      <div class="tiles">
        <div class="tile"><div class="k">Makes playoffs</div><div class="v ${cls(r.in, b.in)}">${pctFull(r.in)}</div><div class="d">${nPicks ? 'was ' + pctFull(b.in) : 'no picks yet'}</div></div>
        ${showBye ? `<div class="tile"><div class="k">First-round bye</div><div class="v ${cls(r.bye, b.bye)}">${pctFull(r.bye)}</div><div class="d">${nPicks ? 'was ' + pctFull(b.bye) : '&nbsp;'}</div></div>`
                  : `<div class="tile"><div class="k">Top seed</div><div class="v ${cls(r.seeds[0], b.seeds[0])}">${pctFull(r.seeds[0])}</div><div class="d">${nPicks ? 'was ' + pctFull(b.seeds[0]) : '&nbsp;'}</div></div>`}
        <div class="tile"><div class="k">Most likely seed</div><div class="v">#${best + 1}</div><div class="d">${pctFull(r.seeds[best])} of sims</div></div>
      </div></div>`;
  }

  const table = `<div class="tbl-wrap"><table>
    <thead><tr><th class="l">Team</th><th>Rec</th><th>In</th>${showBye ? '<th>Bye</th>' : ''}
      ${Array.from({ length: seedCols }, (_, i) => `<th>#${i + 1}</th>`).join('')}<th>Avg</th></tr></thead><tbody>
    ${rows.map((x, k) => `<tr class="${x.t.id === myTeam ? 'me' : ''}${k === nin - 1 && nin < rows.length ? ' cut' : ''}">
      <td class="l team"><div class="w">${logo(x.t)}<span>${esc(x.t.school_name)}</span></div></td>
      <td>${record(x.t.id)}</td>
      <td>${pct(x.r.in)}${nPicks ? delta(x.r.in, x.b.in) : ''}</td>
      ${showBye ? `<td>${pct(x.r.bye)}${nPicks ? delta(x.r.bye, x.b.bye) : ''}</td>` : ''}
      ${Array.from({ length: seedCols }, (_, i) => { const v = x.r.seeds[i]; return v < 0.0005 ? '<td class="dim">—</td>' : `<td${v >= 0.3 ? ' style="font-weight:700"' : ''}>${pct(v)}</td>`; }).join('')}
      <td>${x.r.avgSeed.toFixed(1)}</td></tr>`).join('')}
    </tbody></table></div>`;

  $('app').innerHTML = `<div class="layout">
    <div class="card">
      <div class="card-h"><h2>${esc(region)} — projected</h2><span class="status" id="status">${nPicks ? nPicks + ' pick' + (nPicks > 1 ? 's' : '') : 'Current odds'}</span></div>
      ${hero}${table}
      <div class="note">Top ${nin} make the playoffs${nbye && nbye < nin ? `; top ${nbye} get a first-round bye` : ''}. Ranked by Crabtree. Games you don't pick are simulated from our win probabilities. Arrows show the change from no picks.</div>
    </div>
    <div class="card">
      <div class="card-h"><h2>Remaining games</h2>
        <div class="seg" id="viewSeg">
          <button data-v="region" class="${view === 'region' ? 'on' : ''}">This race</button>
          <button data-v="all" class="${view === 'all' ? 'on' : ''}">All</button>
        </div></div>
      <div id="games">${gamesHtml()}</div>
    </div></div>`;

  $('viewSeg').onclick = e => { const b = e.target.closest('button'); if (!b) return; view = b.dataset.v; render(); };
  $('games').onclick = e => {
    const b = e.target.closest('.pick'); if (!b) return;
    const id = b.dataset.g, side = b.dataset.s;
    if (picks[id] === side) delete picks[id]; else picks[id] = side;
    schedule();
    renderGamesOnly();
  };
}
const cls = (now, was) => now - was > 0.005 ? 'up' : was - now > 0.005 ? 'down' : '';

function renderGamesOnly() { const g = $('games'); if (g) g.innerHTML = gamesHtml(); }

function gamesHtml() {
  const inRegion = new Set(M.regions[region]);
  // Crabtree counts opponents' records, so a game between two of your
  // rivals' opponents moves the race too. "This race" = games involving a
  // team in the region, or an opponent of one.
  const touch = new Set(inRegion);
  for (const i of inRegion) for (const o of M.opps[i]) touch.add(o);
  const me = myTeam ? M.idx.get(myTeam) : -1;

  const groups = { mine: [], region: [], ripple: [], other: [] };
  for (const g of M.sched) {
    const k = (g.h === me || g.a === me) ? 'mine'
      : (inRegion.has(g.h) || inRegion.has(g.a)) ? 'region'
      : (touch.has(g.h) || touch.has(g.a)) ? 'ripple' : 'other';
    if (view === 'region' && k === 'other') continue;
    groups[k].push(g);
  }
  const title = { mine: `${BY_ID.get(myTeam)?.school_name || ''} games`, region: `${region} games`,
                  ripple: 'Opponents’ games (move Crabtree)', other: 'Everything else' };
  const html = Object.entries(groups).filter(([, v]) => v.length).map(([k, v]) =>
    `<div class="grp"><div class="grp-h">${esc(title[k])}</div>${v.map(gameRow).join('')}</div>`).join('');
  return html || '<div class="empty">No games left in this race — the field is set.</div>';
}

function gameRow(g) {
  const h = M.list[g.h], a = M.list[g.a], p = picks[g.id];
  const btn = (t, side, prob) => `<button class="pick${p === side ? ' win' : p ? ' lose' : ''}" data-g="${g.id}" data-s="${side}">
      ${logo(t)}<span class="n">${esc(t.school_name)}</span><span class="p">${Math.round(prob * 100)}%</span></button>`;
  return `<div class="game"><span class="dt">${fdt(g.date)}</span>${btn(a, 'a', 1 - g.p)}<span class="at">@</span>${btn(h, 'h', g.p)}</div>`;
}

$('clearBtn').onclick = () => { picks = {}; recalc(); };
$('teamSel').onchange = e => { myTeam = e.target.value; render(); };

// ── share ────────────────────────────────────────────────────────────────
function shareUrl() {
  const q = new URLSearchParams();
  q.set('r', region);
  if (myTeam) q.set('t', shortId(myTeam));
  const p = Object.entries(picks).map(([id, s]) => shortId(id) + s).join('.');
  if (p) q.set('p', p);
  return SHARE_BASE + '?' + q.toString();
}

function pickLines() {
  return M.sched.filter(g => picks[g.id]).map(g => {
    const w = M.list[picks[g.id] === 'h' ? g.h : g.a], l = M.list[picks[g.id] === 'h' ? g.a : g.h];
    return `${w.school_name} beats ${l.school_name}`;
  });
}

function loadImg(src) {
  return new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
}
// Team logos come from R2, which sends no CORS headers, so a canvas can only
// use them via the img-proxy edge function.
async function proxiedLogo(url) {
  if (!url) return null;
  try {
    const r = await fetch(`${SB_URL}/functions/v1/img-proxy?url=${encodeURIComponent(url)}`, { headers: { apikey: SB_KEY } });
    if (!r.ok) return null;
    return await loadImg(URL.createObjectURL(await r.blob()));
  } catch (e) { return null; }
}

// Hardwood + stat grid: the brand background, drawn rather than downloaded so
// the card never depends on a network image.
function hardwood(ctx, W, H) {
  let rs = 7; const rnd = () => (rs = (rs * 16807) % 2147483647) / 2147483647;
  const tones = ['#c48a4f', '#b97f45', '#cf9659', '#b47a40', '#c99052', '#bd8449'];
  let x = 0;
  while (x < W) {
    const w = 70 + rnd() * 40;
    ctx.fillStyle = tones[Math.floor(rnd() * tones.length)];
    ctx.fillRect(x, 0, w, H);
    ctx.globalAlpha = .18; ctx.strokeStyle = '#6b4520'; ctx.lineWidth = 1;
    for (let k = 0; k < 9; k++) { const gx = x + rnd() * w; ctx.beginPath(); ctx.moveTo(gx, 0);
      for (let y = 0; y <= H; y += 90) ctx.lineTo(gx + Math.sin(y / 140 + k) * 3, y); ctx.stroke(); }
    ctx.globalAlpha = .35; ctx.fillStyle = '#5a3a1a'; ctx.fillRect(x, 0, 1.5, H);
    let y = rnd() * 400; while (y < H) { ctx.fillRect(x, y, w, 1.5); y += 380 + rnd() * 420; }
    ctx.globalAlpha = 1; x += w;
  }
  // faint stat grid
  ctx.globalAlpha = .13; ctx.strokeStyle = '#3d2610'; ctx.lineWidth = 1;
  for (let gx = 0; gx < W; gx += 120) { ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke(); }
  for (let gy = 0; gy < H; gy += 34) { ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke(); }
  ctx.fillStyle = '#2a1a08'; ctx.font = FC(500,20);
  for (let gy = 26; gy < H; gy += 34) for (let gx = 10; gx < W; gx += 120) {
    const v = (rnd() * 40 - 8).toFixed(1); ctx.fillText((v > 0 ? '+' : '') + v, gx, gy);
  }
  ctx.globalAlpha = 1;
}

async function drawCard() {
  await Promise.all(['700 64px "Barlow Condensed"', '600 30px "Barlow Condensed"', '600 28px "Barlow"', '800 120px "Barlow Condensed"']
    .map(f => document.fonts.load(f).catch(() => {})));
  const c = $('card'), ctx = c.getContext('2d'), W = c.width, H = c.height;
  ctx.clearRect(0, 0, W, H);
  hardwood(ctx, W, H);
  const shade = ctx.createLinearGradient(0, 0, 0, H);
  shade.addColorStop(0, 'rgba(10,8,6,.45)'); shade.addColorStop(.3, 'rgba(10,8,6,.2)'); shade.addColorStop(1, 'rgba(10,8,6,.6)');
  ctx.fillStyle = shade; ctx.fillRect(0, 0, W, H);

  // header: Maine logo + wordmark
  const ml = await loadImg(MAINE_LOGO);
  if (ml) { const h = 150, w = ml.width / ml.height * h; ctx.drawImage(ml, 56, 40, w, h); }
  ctx.fillStyle = '#fff'; ctx.textBaseline = 'alphabetic';
  fitText(ctx, 'MAINE BASKETBALL RANKINGS', 185, 104, W - 185 - 56, 700, 62);
  ctx.fillStyle = 'rgba(255,255,255,.8)';
  fitText(ctx, `PLAYOFF CALCULATOR  ·  FOOTBALL  ·  ${region.toUpperCase()}`, 187, 148, W - 187 - 56, 600, 32);

  // panel
  const px = 48, pw = W - 96; let y = 222;
  const panel = (yy, hh) => { ctx.fillStyle = 'rgba(12,10,8,.78)'; roundRect(ctx, px, yy, pw, hh, 22); ctx.fill(); };

  const lines = pickLines();
  const r = myTeam ? CUR[myTeam] : null, b = myTeam ? BASE[myTeam] : null;
  if (myTeam) {
    panel(y, 300);
    const t = BY_ID.get(myTeam);
    const tl = await proxiedLogo(t.logo_url);
    let tx = px + 36;
    if (tl) { const s = 110; ctx.drawImage(tl, tx, y + 30, s, s); tx += s + 24; }
    ctx.fillStyle = '#fff'; fitText(ctx, t.school_name.toUpperCase(), tx, y + 100, px + pw - 36 - tx, 700, 76);
    ctx.font = FC(600,30); ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillText(`CURRENTLY ${record(t.id)}`, tx, y + 138);
    const best = r.seeds.reduce((bi, v, i, a) => v > a[bi] ? i : bi, 0);
    const stats = [['PLAYOFFS', r.in, b.in], [(M.slots[region]?.bye ?? 0) && (M.slots[region].bye < M.slots[region].in) ? 'BYE' : 'TOP SEED',
                   (M.slots[region]?.bye ?? 0) && (M.slots[region].bye < M.slots[region].in) ? r.bye : r.seeds[0],
                   (M.slots[region]?.bye ?? 0) && (M.slots[region].bye < M.slots[region].in) ? b.bye : b.seeds[0]],
                   [`#${best + 1} SEED`, r.seeds[best], b.seeds[best]]];
    const cw = (pw - 72) / 3;
    stats.forEach(([k, v, was], i) => {
      const sx = px + 36 + i * cw;
      ctx.fillStyle = '#fff'; fitText(ctx, pctFull(v), sx, y + 245, cw - 20, 800, 88);
      ctx.font = FC(700,26); ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fillText(k, sx, y + 168);
      if (lines.length && Math.abs(v - was) >= .005) {
        ctx.font = FC(600,26); ctx.fillStyle = v > was ? '#7ee2a0' : '#ff8f8f';
        ctx.fillText(`${v > was ? '▲' : '▼'} from ${pctFull(was)}`, sx, y + 280);
      }
    });
    y += 324;
  }

  // scenario
  const shown = lines.slice(0, myTeam ? 6 : 9);
  const sh = 70 + Math.max(1, shown.length) * 40 + (lines.length > shown.length ? 40 : 0);
  panel(y, sh);
  ctx.fillStyle = '#f2b46d'; ctx.font = FC(700,30); ctx.fillText(lines.length ? 'IF…' : 'CURRENT ODDS — NO PICKS', px + 36, y + 50);
  ctx.fillStyle = '#fff'; ctx.font = FB(600,30);
  shown.forEach((l, i) => ctx.fillText(clip(ctx, l, pw - 72), px + 36, y + 92 + i * 40));
  if (lines.length > shown.length) { ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fillText(`+ ${lines.length - shown.length} more`, px + 36, y + 92 + shown.length * 40); }
  if (!lines.length) { ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillText('Every remaining game simulated', px + 36, y + 92); }
  y += sh + 24;

  // region table
  const regTeams = M.regions[region].map(i => M.list[i]).map(t => ({ t, r: CUR[t.id] })).sort((a, b) => a.r.avgSeed - b.r.avgSeed);
  const maxRows = Math.max(3, Math.min(regTeams.length, Math.floor((H - 150 - y - 70) / 44)));
  const th = 70 + maxRows * 44;
  panel(y, th);
  ctx.font = FC(700,26); ctx.fillStyle = 'rgba(255,255,255,.65)';
  ctx.fillText(region.toUpperCase(), px + 36, y + 46);
  ctx.textAlign = 'right'; ctx.fillText('PLAYOFFS', px + pw - 230, y + 46); ctx.fillText('LIKELY SEED', px + pw - 36, y + 46); ctx.textAlign = 'left';
  regTeams.slice(0, maxRows).forEach((x, i) => {
    const ry = y + 92 + i * 44;
    if (x.t.id === myTeam) { ctx.fillStyle = 'rgba(242,180,109,.22)'; ctx.fillRect(px + 16, ry - 32, pw - 32, 42); }
    const best = x.r.seeds.reduce((bi, v, k, a) => v > a[bi] ? k : bi, 0);
    ctx.fillStyle = '#fff'; ctx.font = FB(600,30); ctx.fillText(clip(ctx, x.t.school_name, pw - 380), px + 36, ry);
    ctx.font = FC(700,32); ctx.textAlign = 'right';
    ctx.fillText(pct(x.r.in), px + pw - 230, ry);
    ctx.fillText(`#${best + 1}  ${pct(x.r.seeds[best])}`, px + pw - 36, ry); ctx.textAlign = 'left';
  });

  // footer: call to action, then the fine print
  ctx.fillStyle = 'rgba(255,255,255,.8)';
  fitText(ctx, `RUN YOUR OWN SCENARIOS  ·  10,000 SIMULATIONS  ·  ${new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }).toUpperCase()}`, 56, H - 96, W - 112, 600, 28);
  ctx.fillStyle = '#fff';
  fitText(ctx, 'MAINEBASKETBALLRANKINGS.COM', 56, H - 46, W - 112, 800, 46);
}
function FC(w, px) { return `${w} ${px}px "Barlow Condensed", "Arial Narrow", sans-serif`; }
function FB(w, px) { return `${w} ${px}px "Barlow", Arial, sans-serif`; }
// Draw text no wider than `max`, shrinking the font if it has to.
function fitText(ctx, txt, x, y, max, w, px, cond = true) {
  let size = px;
  do { ctx.font = cond ? FC(w, size) : FB(w, size); } while (ctx.measureText(txt).width > max && --size > 12);
  ctx.fillText(txt, x, y);
}
function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function clip(ctx, s, max) { if (ctx.measureText(s).width <= max) return s; while (s.length && ctx.measureText(s + '…').width > max) s = s.slice(0, -1); return s + '…'; }

function cardBlob() { return new Promise(r => $('card').toBlob(r, 'image/png')); }
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 1800); }
const fileName = () => `playoff-calculator-${(myTeam ? BY_ID.get(myTeam).school_name : region).toLowerCase().replace(/[^a-z0-9]+/g, '-')}.png`;

};
$('dlBtn').onclick = async () => {
  const blob = await cardBlob(); if (!blob) return;
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fileName(); a.click();
};
$('copyBtn').onclick = async () => {
  try { await navigator.clipboard.writeText(shareUrl()); toast('Link copied'); }
  catch (e) { prompt('Copy this link:', shareUrl()); }
};
$('closeShare').onclick = () => $('shareModal').classList.remove('on');

init();
</script>
<script>
(function(){
  if (window.MBREmbed && MBREmbed.initResize) { MBREmbed.initResize(); return; }
  function sendHeight(){ window.parent.postMessage({ type:"mbr-embed-resize", height: document.documentElement.scrollHeight }, "*"); }
  window.addEventListener("load", sendHeight);
  if (typeof ResizeObserver === "function") new ResizeObserver(sendHeight).observe(document.body);
  document.addEventListener("click", function(){ setTimeout(sendHeight, 120); });
})();
</script>
