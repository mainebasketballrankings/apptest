<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBR 2025-26 Preseason Basketball Poll</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,800;1,600&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── TOKENS ────────────────────────────────────────────────────────── */
:root {
  --orange: #ee6730;
  --orange-dim: #b84d22;
  --bg: #111113;
  --nav-bg: #18181b;
  --surface: #1c1c1f;
  --surface2: #242428;
  --border: #2e2e36;
  --text: #e8e8ee;
  --muted: #7a7a8c;
  --gold: #f5c842;
  --silver: #b0b0c0;
  --bronze: #cd7f32;
  --boys: #3b9eff;
  --girls: #c36ef0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Barlow', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* ── NAV ───────────────────────────────────────────────────────────── */
.site-nav {
  background: var(--nav-bg);
  border-bottom: 2px solid var(--orange);
  position: sticky; top: 0; z-index: 100;
}
.nav-inner {
  display: flex; align-items: center;
  padding: 0 20px; height: 52px;
  max-width: 1200px; margin: 0 auto;
}
.nav-logo {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 800; font-size: 20px;
  color: var(--orange); letter-spacing: .06em;
  text-decoration: none; flex-shrink: 0;
}
.nav-links {
  display: flex; align-items: center;
  gap: 2px; margin-left: 20px; flex: 1;
}
.nav-link {
  font-family: 'Barlow', sans-serif;
  font-weight: 600; font-size: 14px;
  color: var(--muted); text-decoration: none;
  padding: 6px 12px; border-radius: 4px;
  transition: color .15s, background .15s;
  white-space: nowrap;
}
.nav-link:hover { color: var(--text); background: rgba(255,255,255,.05); }
.nav-link.active { color: var(--orange); }
.nav-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

/* burger */
.burger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 6px; }
.burger span { display: block; width: 22px; height: 2px; background: var(--text); border-radius: 2px; transition: transform .2s, opacity .2s; }
.burger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.burger.open span:nth-child(2) { opacity: 0; }
.burger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

.drawer {
  display: none; flex-direction: column;
  background: var(--nav-bg); border-top: 1px solid var(--border);
  padding: 12px 20px 16px;
}
.drawer.open { display: flex; }
.drawer .nav-link { padding: 10px 0; border-bottom: 1px solid var(--border); border-radius: 0; }
.drawer .nav-link:last-child { border-bottom: none; }

@media (max-width: 700px) {
  .nav-links { display: none; }
  .burger { display: flex; }
}

/* ── PAGE HEADER ────────────────────────────────────────────────────── */
.page-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 20px 20px 0;
}
.page-header-inner { max-width: 960px; margin: 0 auto; }
.page-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 800; font-size: 26px;
  letter-spacing: .04em; color: var(--text);
  line-height: 1;
}
.page-meta {
  font-size: 13px; color: var(--muted);
  margin-top: 4px; margin-bottom: 16px;
}

/* ── GENDER TOGGLE ──────────────────────────────────────────────────── */
.gender-tabs {
  display: flex; gap: 0; margin-top: 4px;
}
.gender-tab {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700; font-size: 13px;
  letter-spacing: .08em; text-transform: uppercase;
  padding: 10px 20px 9px;
  cursor: pointer; border: none; background: none;
  color: var(--muted);
  border-bottom: 3px solid transparent;
  transition: color .15s, border-color .15s;
}
.gender-tab:hover { color: var(--text); }
.gender-tab[data-g="boys"].active  { color: var(--boys);  border-bottom-color: var(--boys); }
.gender-tab[data-g="girls"].active { color: var(--girls); border-bottom-color: var(--girls); }

/* ── CLASS TABS ─────────────────────────────────────────────────────── */
.class-tabs {
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
  display: flex; overflow-x: auto; padding: 0 20px;
}
.class-tab {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 600; font-size: 13px;
  letter-spacing: .06em; text-transform: uppercase;
  color: var(--muted); padding: 12px 16px 10px;
  cursor: pointer; border-bottom: 3px solid transparent;
  white-space: nowrap; transition: color .15s, border-color .15s;
  user-select: none; background: none; border-top: none;
  border-left: none; border-right: none;
}
.class-tab:hover { color: var(--text); }
.class-tab.active { color: var(--orange); border-bottom-color: var(--orange); }

/* ── MAIN CONTENT ───────────────────────────────────────────────────── */
.main { max-width: 960px; margin: 0 auto; padding: 24px 20px 48px; }
.summary-note {
  font-size: 12px; color: var(--muted);
  text-align: center; margin-bottom: 20px;
  line-height: 1.6;
}
.summary-note strong { color: var(--orange); font-weight: 600; }

.division-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 18px;
}
@media (max-width: 620px) { .division-grid { grid-template-columns: 1fr; } }

.class-section { margin-bottom: 28px; }
.class-section-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 800; font-size: 17px;
  letter-spacing: .08em; text-transform: uppercase;
  color: var(--orange); margin-bottom: 12px;
  padding-bottom: 6px;
  border-bottom: 2px solid var(--border);
  display: flex; align-items: baseline; gap: 10px;
}
.class-section-label small {
  font-size: 12px; font-weight: 600;
  color: var(--muted); letter-spacing: .04em;
}

/* ── REGION CARD ────────────────────────────────────────────────────── */
.region-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px; overflow: hidden;
}
.region-header {
  background: var(--surface2);
  padding: 11px 16px;
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid var(--border);
}
.region-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700; font-size: 14px;
  letter-spacing: .06em; text-transform: uppercase;
}
.voter-count { font-size: 12px; color: var(--muted); }

.rankings-list { list-style: none; }
.rank-row {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 14px;
  border-bottom: 1px solid rgba(255,255,255,.04);
  transition: background .1s;
}
.rank-row:last-child { border-bottom: none; }
.rank-row:hover { background: rgba(238,103,48,.05); }

.rank-num {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700; font-size: 14px;
  width: 20px; text-align: right; flex-shrink: 0;
  color: var(--muted);
}
.rank-row:nth-child(1) .rank-num { color: var(--gold); }
.rank-row:nth-child(2) .rank-num { color: var(--silver); }
.rank-row:nth-child(3) .rank-num { color: var(--bronze); }

.rank-medal { font-size: 13px; width: 16px; flex-shrink: 0; }

.school-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 600; font-size: 15px;
  flex: 1; letter-spacing: .01em;
}

.fp-badge {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px; font-weight: 700;
  color: var(--gold);
  background: rgba(245,200,66,.1);
  border: 1px solid rgba(245,200,66,.25);
  border-radius: 3px; padding: 1px 5px;
  flex-shrink: 0; letter-spacing: .04em;
  white-space: nowrap;
}

.pts-wrap { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
.pts-bar {
  height: 5px; border-radius: 3px;
  background: var(--orange); opacity: .65; min-width: 2px;
}
.pts-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px; color: var(--muted);
  width: 30px; text-align: right;
}

/* bar color by gender */
body[data-gender="boys"]  .pts-bar { background: var(--boys); }
body[data-gender="girls"] .pts-bar { background: var(--girls); }
</style>

// ── CONFIG ─────────────────────────────────────────────────────────────────
const KEYS = [
  {key:'a_north', label:'Class A North'}, {key:'a_south', label:'Class A South'},
  {key:'b_north', label:'Class B North'}, {key:'b_south', label:'Class B South'},
  {key:'c_north', label:'Class C North'}, {key:'c_south', label:'Class C South'},
  {key:'d_north', label:'Class D North'}, {key:'d_south', label:'Class D South'},
  {key:'s_north', label:'Class S North'}, {key:'s_south', label:'Class S South'},
];
const CLASS_NAMES = {a:'Class A', b:'Class B', c:'Class C', d:'Class D', s:'Class S'};

// ── STATE ──────────────────────────────────────────────────────────────────
let gender = 'boys';
let cls = 'all';
let computed = {};

// ── COMPUTE ────────────────────────────────────────────────────────────────
function compute(raw) {
  const scores = {}, fp = {}, voters = {};
  KEYS.forEach(k => { scores[k.key] = {}; fp[k.key] = {}; voters[k.key] = 0; });
  raw.forEach(ballot => {
    Object.entries(ballot).forEach(([region, picks]) => {
      if (!scores[region]) return;
      voters[region]++;
      picks.forEach(({l, r}) => {
        const pts = Math.max(0, 16 - r);
        scores[region][l] = (scores[region][l] || 0) + pts;
        if (r === 1) fp[region][l] = (fp[region][l] || 0) + 1;
      });
    });
  });
  const ranked = {};
  KEYS.forEach(k => {
    ranked[k.key] = Object.entries(scores[k.key])
      .sort((a, b) => b[1] - a[1])
      .map(([name, pts]) => ({name, pts, fp: fp[k.key][name] || 0}));
  });
  return {ranked, voters, total: raw.length};
}

// Pre-compute both
computed.boys  = compute(DATA.boys);
computed.girls = compute(DATA.girls);

// ── RENDER ─────────────────────────────────────────────────────────────────
function renderCard(regionKey) {
  const {ranked, voters} = computed[gender];
  const cfg = KEYS.find(k => k.key === regionKey);
  const teams = ranked[regionKey];
  const v = voters[regionKey];
  if (!teams || !teams.length) return '';
  const maxPts = teams[0]?.pts || 1;
  const medals = ['🥇','🥈','🥉'];
  const rows = teams.map((t, i) => {
    const barW = Math.round((t.pts / maxPts) * 68);
    const fpBadge = t.fp > 0 ? `<span class="fp-badge">${t.fp}×1st</span>` : '';
    return `<li class="rank-row">
      <span class="rank-num">${i+1}</span>
      <span class="rank-medal">${medals[i] || ''}</span>
      <span class="school-name">${t.name}</span>
      ${fpBadge}
      <div class="pts-wrap">
        <div class="pts-bar" style="width:${barW}px"></div>
        <span class="pts-label">${t.pts}</span>
      </div>
    </li>`;
  }).join('');
  return `<div class="region-card">
    <div class="region-header">
      <span class="region-name">${cfg.label}</span>
      <span class="voter-count">${v} ballot${v !== 1 ? 's' : ''}</span>
    </div>
    <ul class="rankings-list">${rows}</ul>
  </div>`;
}

function renderContent() {
  const {total} = computed[gender];
  const gLabel = gender === 'boys' ? 'Boys' : 'Girls';
  document.getElementById('summary').innerHTML =
    `<strong>${total}</strong> ${gLabel} ballot entries · Gold badge = first-place votes received`;

  const content = document.getElementById('content');
  if (cls === 'all') {
    content.innerHTML = ['a','b','c','d','s'].map(c => {
      const cards = ['north','south'].map(dir => renderCard(`${c}_${dir}`)).join('');
      if (!cards.trim()) return '';
      return `<div class="class-section">
        <div class="class-section-label">${CLASS_NAMES[c]} <small>North &amp; South</small></div>
        <div class="division-grid">${cards}</div>
      </div>`;
    }).join('');
  } else {
    const cards = ['north','south'].map(dir => renderCard(`${cls}_${dir}`)).join('');
    content.innerHTML = `<div class="division-grid">${cards}</div>`;
  }
}

// ── EVENT WIRING ───────────────────────────────────────────────────────────
// Gender tabs
document.querySelectorAll('.gender-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.gender-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    gender = btn.dataset.g;
    document.body.dataset.gender = gender;
    renderContent();
  });
});

// Class tabs
document.querySelectorAll('.class-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.class-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    cls = btn.dataset.cls;
    renderContent();
  });
});

// Burger
const burger = document.getElementById('burger');
const drawer = document.getElementById('drawer');
burger.addEventListener('click', () => {
  burger.classList.toggle('open');
  drawer.classList.toggle('open');
});

// ── INIT ───────────────────────────────────────────────────────────────────
renderContent();
</script>
