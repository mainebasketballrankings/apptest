  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="mbr-scoreboard.js"></script>

  <style>
    :root {
      --green:  #1a7a4a;
      --green2: #22a863;
      --red:    #c0392b;
      --gray:   #555;
      --lgray:  #999;
      --border: #e2e2e2;
      --bg:     #ffffff;
      --white:  #fff;
      --black:  #111;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body { margin: 0; padding: 0; overflow-x: hidden;
  /* iframe embed */
      font-family: 'Barlow', sans-serif;
      background: var(--bg);
      color: var(--black);
      min-height: 100vh;
    }


    /* PAGE */
    .page { max-width: 1100px; margin: 0 auto; padding: 28px 20px 80px; }

    /* DATE BAR */
    .date-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .date-heading {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 600;
      font-size: 26px;
      color: var(--black);
    }

    .date-nav { display: flex; align-items: center; gap: 6px; }

    .date-picker {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 13px;
      background: var(--white);
      border: 1px solid var(--border);
      color: var(--gray);
      padding: 0 10px; height: 34px;
      border-radius: 6px;
      cursor: pointer;
      outline: none;
    }
    .date-picker:focus { border-color: #bbb; }

    .date-btn {
      background: var(--white);
      border: 1px solid var(--border);
      color: var(--gray);
      width: 34px; height: 34px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }

    .date-btn:hover { background: var(--bg); color: var(--black); border-color: #bbb; }

    .date-today {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      background: var(--white);
      border: 1px solid var(--border);
      color: var(--gray);
      padding: 0 14px; height: 34px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .date-today:hover { background: var(--bg); color: var(--black); border-color: #bbb; }

    /* SPORT TABS */
    .sport-tabs {
      display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap;
    }
    @media (max-width: 640px) {
      .sport-tabs {
        flex-wrap: nowrap;
        overflow-x: auto;
        scrollbar-width: none;
        -ms-overflow-style: none;
        padding-bottom: 4px;
        margin-left: -16px;
        margin-right: -16px;
        padding-left: 16px;
        padding-right: 16px;
      }
      .sport-tabs::-webkit-scrollbar { display: none; }
      .sport-tab { flex-shrink: 0; }
      .filters {
        flex-wrap: nowrap !important;
        overflow-x: auto;
        scrollbar-width: none;
        -ms-overflow-style: none;
        padding-bottom: 4px;
        margin-left: -16px;
        margin-right: -16px;
        padding-left: 16px;
        padding-right: 16px;
      }
      .filters::-webkit-scrollbar { display: none; }
      .filter-btn { flex-shrink: 0; }
    }
    .sport-tab {
      padding: 5px 14px; border-radius: 20px; border: 1.5px solid var(--border);
      background: var(--white); font-size: 13px; font-weight: 600; cursor: pointer;
      color: var(--gray); transition: all .15s;
    }
    .sport-tab:hover { border-color: #bbb; color: var(--black); }
    .sport-tab.active { background: var(--black); border-color: var(--black); color: #fff; }

    /* FILTERS */
    .filters { display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }

    .filter-btn {
      font-family: 'Barlow', sans-serif;
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.2px;
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--white);
      color: var(--gray);
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-btn:hover { color: var(--black); border-color: #bbb; }
    .filter-btn.active { background: var(--green); border-color: var(--green); color: #fff; }

    /* SECTION LABEL */
    .sport-section-header {
      font-family: 'Barlow', sans-serif;
      font-weight: 700; font-size: 18px;
      color: var(--black);
      margin: 24px 0 8px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--border);
    }
    .sport-section-header:first-child { margin-top: 0; }

    .section-label {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--lgray);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* GRID */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
      gap: 10px;
      margin-bottom: 30px;
    }

    /* CARD */
    .game-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      transition: box-shadow 0.15s;
    }

    .game-card:hover { box-shadow: 0 4px 18px rgba(0,0,0,0.09); }
    .card-body { margin: 0; padding: 0; overflow-x: hidden;
  /* iframe embed */ cursor: pointer; }

    .game-card.live {
      border-color: var(--green2);
      box-shadow: 0 0 0 1px var(--green2), 0 4px 18px rgba(34,168,99,0.12);
    }

    /* status bar */
    .card-top {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      padding: 5px 12px;
      background: #fafafa;
      border-bottom: 1px solid var(--border);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      color: var(--lgray);
    }
    .card-top-center {
      text-align: center;
      padding: 0 6px;
    }
    .card-top > :last-child {
      display: flex;
      justify-content: flex-end;
      min-width: 0;
    }
    .card-top .submit-btn-inline {
      align-self: center;
      width: auto !important;
    }
    .card-top .submit-btn-inline {
      font-size: 8px !important;
      padding: 0 5px !important;
      height: 16px !important;
      line-height: 16px !important;
      letter-spacing: 0.8px;
      border-radius: 3px !important;
      align-self: center;
      justify-self: end;
      width: auto !important;
    }

    .live-dot {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green2);
      margin-right: 5px;
      animation: blink 1.2s ease-in-out infinite;
    }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.25} }

    /* teams */
    .card-body { margin: 0; padding: 0; overflow-x: hidden;
  /* iframe embed */ padding: 12px 14px 10px; }

    .team-row {
      display: grid;
      grid-template-columns: 38px 1fr auto;
      align-items: center;
      gap: 9px;
      margin-bottom: 7px;
    }

    .team-row:last-child { margin-bottom: 0; }

    .logo-wrap {
      width: 38px; height: 38px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .team-logo {
      max-width: 38px; max-height: 38px;
      width: auto; height: auto;
      object-fit: contain;
      display: block;
    }

    .logo-initial {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--bg);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 600;
      font-size: 15px;
      color: var(--lgray);
    }

    .team-name-wrap { min-width: 0; display: flex; flex-direction: column; justify-content: center; }

    .team-name {
      font-family: 'Barlow', sans-serif;
      font-weight: 600;
      font-size: 17px;
      line-height: 1.15;
      white-space: normal;
      overflow: visible;
      color: var(--black);
    }

    .team-name .rnk { color: var(--lgray); font-weight: 600; }
    .team-name.winner { font-weight: 600; }
    .team-name.loser  { color: var(--lgray); font-weight: 600; }
    a.team-name { text-decoration: none; color: inherit; }
    a.team-name:hover { color: var(--green); text-decoration: underline; }

    .team-score {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 500;
      font-size: 26px;
      line-height: 1;
      min-width: 34px;
      text-align: right;
      color: var(--black);
    }

    .team-score.winner { color: var(--black); }
    .team-score.loser  { color: var(--lgray); font-weight: 600; }
    .team-score.empty  { color: var(--lgray); font-size: 18px; font-weight: 600; }

    /* footer */
    .card-footer {
      padding: 7px 12px 9px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-meta { font-size: 11px; color: var(--lgray); line-height: 1.5; flex: 1; min-width: 0; }

    .card-meta .stream-link {
      display: inline-block;
      color: var(--green2);
      font-weight: 700;
      text-decoration: none;
      font-size: 10px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .card-meta .stream-link:hover { text-decoration: underline; }

    .card-notes {
      font-size: 10px;
      color: var(--gray);
      line-height: 1.4;
      margin-top: 2px;
      font-style: italic;
    }

    .card-footer-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }

    .stax-badge {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 600;
      font-size: 12px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .stax-badge.gray   { color: #aaa; }
    .stax-badge.yellow { color: #d4a00a; }
    .stax-badge.orange { color: #e07020; }
    .stax-badge.red    { color: #c0392b; }

    .stream-icon {
      height: 24px;
      width: 24px;
      object-fit: contain;
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
      border-radius: 4px;
    }

    .submit-btn-inline {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      background: transparent;
      border: 1px solid var(--green);
      color: var(--green);
      padding: 4px 10px;
      border-radius: 5px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.15s;
    }

    .submit-btn-inline:hover { background: var(--green); color: #fff; }

    .live-btn {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700; font-size: 11px;
      letter-spacing: 0.5px; text-transform: uppercase;
      background: transparent; border: 1px solid var(--green);
      color: var(--green); padding: 4px 10px;
      border-radius: 5px;
      white-space: nowrap; flex-shrink: 0;
      text-decoration: none;
      transition: all 0.15s;
    }
    .live-btn:hover { background: var(--green); color: #fff; }
    .ppd-btn {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700; font-size: 11px;
      letter-spacing: 0.5px; text-transform: uppercase;
      background: transparent; border: 1px solid var(--lgray);
      color: var(--lgray); padding: 4px 10px;
      border-radius: 5px; cursor: pointer;
      white-space: nowrap; flex-shrink: 0;
      transition: all 0.15s;
    }
    .ppd-btn:hover { border-color: #c0392b; color: #c0392b; }

    /* POSTPONED CARD */
    .game-card.postponed {
      background: #e8e8e8;
      border-color: #ccc;
    }
    .game-card.postponed .card-top {
      background: #ddd;
      border-bottom-color: #ccc;
    }
    .game-card.postponed .card-body { margin: 0; padding: 0; overflow-x: hidden;
  /* iframe embed */
      opacity: 0.45;
    }
    .game-card.postponed .card-footer {
      background: #e0e0e0;
      border-top-color: #ccc;
    }
    .ppd-badge {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 600; font-size: 11px;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: #c0392b;
      background: rgba(192,57,43,0.1);
      border: 1px solid rgba(192,57,43,0.3);
      border-radius: 4px;
      padding: 1px 7px;
    }

    /* PPD PANEL */
    .ppd-panel {
      display: none;
      background: #f8f9fa;
      border-top: 1px solid var(--border);
      padding: 14px;
    }
    .ppd-panel.open { display: block; }
    .ppd-panel h4 {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700; font-size: 10px;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--lgray); margin-bottom: 10px;
    }
    .ppd-row {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .ppd-date-input {
      font-family: 'Barlow', sans-serif; font-size: 13px;
      border: 1px solid var(--border); border-radius: 5px;
      padding: 5px 9px; background: var(--white);
      color: var(--black); outline: none;
    }
    .ppd-date-input:focus { border-color: #bbb; }
    .ppd-time-input {
      font-family: 'Barlow', sans-serif; font-size: 13px;
      border: 1px solid var(--border); border-radius: 5px;
      padding: 5px 9px; background: var(--white);
      color: var(--black); outline: none; width: 120px;
    }
    .ppd-time-input:focus { border-color: #bbb; }
    .ppd-submit {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700; font-size: 12px;
      letter-spacing: 0.5px; text-transform: uppercase;
      background: #c0392b; color: #fff;
      border: none; border-radius: 5px;
      padding: 6px 14px; cursor: pointer;
      transition: opacity 0.15s;
    }
    .ppd-submit:hover { opacity: 0.85; }
    .ppd-hint {
      font-size: 11px; color: var(--lgray);
      width: 100%; margin-top: 4px;
    }

    /* SUBMIT PANEL */
    .submit-panel {
      display: none;
      background: #f8f9fa;
      border-top: 1px solid var(--border);
      padding: 14px;
    }

    .submit-panel.open { display: block; }

    .submit-panel h4 {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--lgray);
      margin-bottom: 10px;
    }

    .score-inputs {
      display: grid;
      grid-template-columns: 1fr 20px 1fr;
      gap: 6px;
      align-items: end;
      margin-bottom: 8px;
    }

    .si-group { display: flex; flex-direction: column; gap: 3px; }

    .si-group label {
      font-size: 10px;
      color: var(--lgray);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: normal;
      overflow: visible;
    }

    .si-group input {
      background: var(--white);
      border: 1px solid var(--border);
      color: var(--black);
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 600;
      font-size: 26px;
      text-align: center;
      padding: 6px;
      border-radius: 6px;
      width: 100%;
      outline: none;
      transition: border-color 0.15s;
    }

    .si-group input:focus { border-color: var(--green2); }

    .si-dash {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 600;
      font-size: 18px;
      color: var(--lgray);
      text-align: center;
      padding-bottom: 9px;
    }

    .si-extras { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }

    .si-clock-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    .si-pills { display: flex; gap: 4px; }
    .si-pill {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.3px;
      padding: 6px 9px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--white);
      color: var(--gray);
      cursor: pointer;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
      line-height: 1;
    }
    .si-pill.active {
      background: var(--black);
      border-color: var(--black);
      color: #fff;
    }
    .si-vb-pts {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--gray);
    }
    .si-vb-pts input {
      width: 48px !important;
      text-align: center;
      font-family: 'Barlow Condensed', sans-serif !important;
      font-weight: 700 !important;
      font-size: 14px !important;
    }

    .si-select {
      background: var(--white);
      border: 1px solid var(--border);
      color: var(--black);
      font-family: 'Barlow', sans-serif;
      font-size: 12px;
      padding: 7px 10px;
      border-radius: 6px;
      outline: none;
      transition: border-color 0.15s;
      flex: 1;
    }
    .si-select:focus { border-color: var(--green2); }

    .si-time {
      background: var(--white);
      border: 1px solid var(--border);
      color: var(--black);
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 14px;
      padding: 7px 10px;
      border-radius: 6px;
      width: 72px;
      outline: none;
      transition: border-color 0.15s;
      text-align: center;
    }
    .si-time:focus { border-color: var(--green2); }
    .si-time::placeholder { color: var(--lgray); font-weight: 400; }

    .si-extras input,
    .si-extras textarea {
      background: var(--white);
      border: 1px solid var(--border);
      color: var(--black);
      font-family: 'Barlow', sans-serif;
      font-size: 12px;
      padding: 7px 10px;
      border-radius: 6px;
      width: 100%;
      outline: none;
      transition: border-color 0.15s;
    }

    .si-extras input:focus,
    .si-extras textarea:focus { border-color: var(--green2); }
    .si-extras textarea { resize: vertical; min-height: 50px; }
    .si-extras input::placeholder,
    .si-extras textarea::placeholder { color: var(--lgray); }

    .si-row {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }

    .final-label {
      display: flex; align-items: center; gap: 5px;
      font-size: 12px; color: var(--gray); cursor: pointer;
    }

    .final-label input[type=checkbox] { accent-color: var(--green2); }

    .si-submit {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      background: var(--green);
      color: #fff;
      border: none;
      padding: 8px 20px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .si-submit:hover { background: var(--green2); }
    .si-submit:disabled { opacity: 0.5; cursor: not-allowed; }

    .si-success {
      display: none;
      font-size: 12px;
      color: var(--green2);
      font-weight: 600;
      padding-top: 6px;
    }

    /* LOADING / EMPTY */
    .loading {
      display: flex; flex-direction: column; align-items: center;
      gap: 14px; padding: 60px 20px; color: var(--lgray);
    }

    .export-section {

    .export-section-label {

<script>
  const SUPABASE_URL = 'https://vtwupenqieesoktonbzg.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ0d3VwZW5xaWVlc29rdG9uYnpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI0MTA0MzgsImV4cCI6MjA4Nzk4NjQzOH0.OqkqF7NXr5LBQsQ0sl6S2o-kzQqbtBlRCLFszRnUoHA';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storageKey: 'mbr-index' } });

  // Cached short-date formatter — avoids repeated option-object allocation inside card()
  const _shortDateFmt = new Intl.DateTimeFormat('en-US', { month:'numeric', day:'numeric' });

  // Single canonical sport label map (replaces SPORT_DISPLAY_NAME, SPORT_LABEL_MAP, SPORT_LABEL)
  const SPORT_LABEL = {

  const SPORT_IDS = {
    'basketball':   'b31ab283-b28e-4ba8-9684-b1cf30cea219',

    'lacrosse':     '9c34ec5c-81b4-4e2e-9f60-740bb30fee4d',
    'soccer':       'ff80a695-0e78-4432-98f2-141b2b571e0e',

    'football':     'fa905ca5-f416-409b-81ac-777179ee5576',

  const SPORT_CLASSES = {
    'basketball':   ['A','B','C','D','S'],
    'baseball':     ['A','B','C','D'],
    'softball':     ['A','B','C','D'],
    'lacrosse':     ['A','B','C'],
    'soccer':       ['A','B','C','D','8'],
    'field-hockey': ['A','B','C'],
    'football':     ['A','B','C','D','8L','8S'],
    'volleyball':   ['A','B','C','D'],
  };
  // Sports locked to a single gender (no Boys/Girls sub-tabs)
  const SPORT_GENDER = {
    'baseball':     'Boys',

  };

  function buildFilterButtons() {
    // In 'all' mode, show Boys/Girls only (class filter too complex across sports)
    // In single sport mode, show full class filter
    let genderBtns = '';
    let classBtns  = '';

    if (activeSport === 'all') {
      genderBtns = `<button class="filter-btn" data-filter="Boys">Boys</button>
                    <button class="filter-btn" data-filter="Girls">Girls</button>`;
    } else {
      const singleGender = SPORT_GENDER[activeSport];
      const classes = SPORT_CLASSES[activeSport] || ['A','B','C','D'];
      if (!singleGender) {
        genderBtns = `<button class="filter-btn" data-filter="Boys">Boys</button>
                      <button class="filter-btn" data-filter="Girls">Girls</button>`;
      }
      classBtns = classes.map(c => `<button class="filter-btn" data-filter="${c}">Class ${c}</button>`).join('');
    }
    document.getElementById('filters').innerHTML =
      `<button class="filter-btn active" data-filter="all">All</button>${genderBtns}${classBtns}`;
    activeFilter = 'all';
  }

  // ── STATE ────────────────────────────────────────────────────────────────
  let currentDate    = new Date();
  let allGames       = [];        // active sport's games (kept for submit handler)
  let allSportsGames = {};        // { sport: { games, notesMap } } — cached per date
  let recordMap      = {};        // team_id -> 'W-L' string from latest snapshot
  let activeFilter   = 'all';
  let activeSport    = 'all';
  let activeSeason   = 2026;
  let rankMap        = {};
  let seedMap        = {};

  // ── DATE / TIME HELPERS ──────────────────────────────────────────────────
  function toISO(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function fmtHeading(d) {
    return toISO(d) === toISO(new Date()) ? "Today's Games"
      : d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
  }
  function fmtSub(d) {
    return d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });
  }
  function fmtTime(t) {
    if (!t) return '';
    const [h, m] = t.split(':');
    const hr = parseInt(h);
    return `${hr > 12 ? hr-12 : hr || 12}:${m} ${hr >= 12 ? 'PM' : 'AM'}`;
  }

  // ── RANKS ────────────────────────────────────────────────────────────────
  // ── RANKS ────────────────────────────────────────────────────────────────
  // Re-fetched on every date change. Different sports have different snapshot
  // dates so we can't filter by a single latestDate — instead take first
  // occurrence of each team_id (ordered desc = most recent rank per team).
  async function loadRanks() {
    rankMap = {};
    try {
      const { data, error } = await sb
        .from('rankings_snapshots')
        .select('team_id, rank_overall, snapshot_date, tournament_odds')
        .eq('season_year', 2026)
        .not('rank_overall', 'is', null)
        .order('snapshot_date', { ascending: false })
        .limit(2000);
      if (error) { console.warn('loadRanks error:', error); return; }
      if (!data?.length) return;
      data.forEach(r => {
        if (!(r.team_id in rankMap)) rankMap[r.team_id] = r.rank_overall;
        if (r.tournament_odds?.seed && r.tournament_odds.seed < 99) {
          if (!(r.team_id in seedMap)) seedMap[r.team_id] = r.tournament_odds.seed;
        }
      });
    } catch(e) { console.warn('loadRanks threw:', e); }
  }

  // ── GAME FETCH ───────────────────────────────────────────────────────────
  async function fetchSportGames(ds, sport, season) {
    const { data, error } = await sb.from('games').select(`
      id, game_date, game_time, location, status, new_date, stream_url, stax_index, event,
      is_neutral_site, is_tournament, is_summer,
      home_score, away_score, home_score_live, away_score_live, game_clock, notes,
      home_team:home_team_id ( id, school_name, gender, logo_url, stream_url, team_class,
        team_classifications ( classes ( name ) ) ),
      away_team:away_team_id ( id, school_name, gender, logo_url, team_class,
        team_classifications ( classes ( name ) ) )
    `).eq('game_date', ds)
      .eq('sport_id', SPORT_IDS[sport])
      .eq('season_year', season)
      .order('game_time', { ascending: true, nullsFirst: false });
    if (error || !data) return [];
    return data.filter(g => g.home_team && g.away_team).map(g => ({ ...g, _sport: sport }));
  }

  function buildNotesMap(games) {
    const m = {};
    games.forEach(g => { if (g.notes) m[g.id] = g.notes; });
    return m;
  }

  // ── LOAD GAMES ───────────────────────────────────────────────────────────
  // dateChanged=true  → clear cache, re-fetch for the new date
  // dateChanged=false → sport tab switch; use cache if available, fetch only if missing

  // Fetch W-L records for all teams currently on the scoreboard
  async function fetchRecords(teamIds) {
    if (!teamIds.length) return;
    const chunks = [];
    for (let i = 0; i < teamIds.length; i += 50) chunks.push(teamIds.slice(i, i + 50));
    for (const chunk of chunks) {
      const { data } = await sb
        .from('rankings_snapshots')
        .select('team_id,wins,losses')
        .in('team_id', chunk)
        .eq('season_year', 2026)
        .order('snapshot_date', { ascending: false })
        .limit(chunk.length * 40);
      if (!data) continue;
      const seen = new Set();
      for (const row of data) {
        if (!seen.has(row.team_id)) {
          seen.add(row.team_id);
          recordMap[row.team_id] = `${row.wins ?? 0}-${row.losses ?? 0}`;
        }
      }
    }
  }

  async function loadGames(date, dateChanged = true) {
    const ds = toISO(date);
    document.getElementById('dateHeading').textContent = fmtHeading(date);

    if (dateChanged) {
      allSportsGames = {};
      document.getElementById('gamesContainer').innerHTML =
        `<div class="loading"><div class="spinner"></div><span>Loading…</span></div>`;
    }

    // Which sports need fetching?
    const sportsToFetch = activeSport === 'all'
      ? SPORT_PRIORITY
      : [SPORT_PRIORITY.find(s => s.sport === activeSport)].filter(Boolean);

    const needsFetch = sportsToFetch.filter(({ sport }) => !allSportsGames[sport]);

    if (needsFetch.length) {
      if (!dateChanged) {
        document.getElementById('gamesContainer').innerHTML =
          `<div class="loading"><div class="spinner"></div><span>Loading…</span></div>`;
      }
      // Run ranks + game fetches in parallel — both must finish before rendering
      const [fetched] = await Promise.all([
        Promise.all(
          needsFetch.map(({ sport, season }) =>
            fetchSportGames(ds, sport, season).then(games => ({ sport, games }))
          )
        ),
        loadRanks().catch(e => console.warn('loadRanks failed:', e))
      ]);
      fetched.forEach(({ sport, games }) => {
        allSportsGames[sport] = { games, notesMap: buildNotesMap(games) };
      });
    } else {
      // Games already cached — still need fresh ranks for this date
      await loadRanks().catch(e => console.warn('loadRanks failed:', e));
    }

    // Keep allGames in sync for submit handler
    if (activeSport !== 'all' && allSportsGames[activeSport]) {
      allGames = allSportsGames[activeSport].games;
    } else {
      allGames = SPORT_PRIORITY.flatMap(({ sport }) => allSportsGames[sport]?.games || []);
    }

    const sportsWithGames = SPORT_PRIORITY.map(s => s.sport).filter(s => allSportsGames[s]?.games?.length);
    buildSportTabs(sportsWithGames);
    buildFilterButtons();
    renderAllGames();

    // Fetch records async — re-render once they arrive
    const allTeamIds = [...new Set(allGames.flatMap(g => [g.home_team?.id, g.away_team?.id].filter(Boolean)))];
    fetchRecords(allTeamIds).then(() => renderAllGames());

    const activeGames = allGames.filter(g => g.status === 'active');
    if (activeGames.length) await fetchLiveEvents(activeGames);
  }

  // ── SHARED EVENT DESCRIPTION ─────────────────────────────────────────────
  const EVT_LABEL = {
    single:'singles', double:'doubles', triple:'triples', hr:'homers',
    groundout:'grounds out', flyout:'flies out', lineout:'lines out', popup:'pops up',
    strikeout:'strikes out', walk:'walks', hbp:'hit by pitch',
    error:'reaches on error', fielders_choice:"fielder's choice",
    sac_bunt:'sac bunt', sac_fly:'sac fly', sub_pitcher:'pitching change',
    sub_batter:'pinch hit', sub_defense:'defensive sub',
  };

  // Basketball live-ticker labels + clock helper.
  const BBALL_LABEL = {
    '2pt_made':'2-pt basket','2pt_miss':'missed 2','3pt_made':'3-pointer','3pt_miss':'missed 3',
    'putback_made':'putback','putback_miss':'missed putback','ft_made':'free throw','ft_miss':'missed free throw',
    'o_reb':'offensive rebound','d_reb':'defensive rebound','assist':'assist','steal':'steal','block':'block',
    'turnover':'turnover','foul_personal':'personal foul','foul_offensive':'offensive foul','foul_technical':'technical foul',
    'foul_flagrant':'flagrant foul','foul_intentional':'intentional foul','timeout_full':'timeout','timeout_30sec':'timeout',
    'possession_flip':'possession','deflection':'deflection','charge_taken':'charge taken'
  };
  function fmtClock(secs) {
    if (secs == null) return '';
    const s = Math.max(0, secs|0);
    return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  }
  function periodLabel(p) { p = p||1; return p>4 ? `OT${p-4}` : `Q${p}`; }

  function describeEvent(e, sport, game) {
    // Shared football logic (mbr-scoreboard.js) so index and embed can't drift.
    if (window.MBRScoreboard) { const s = MBRScoreboard.describe(e, sport); if (s !== null) return s; }
    // ── FOOTBALL ──
    // The baseball path appended "· 1 run" to anything with points, which is how
    // an extra point ended up reading as a run.
    if (sport === 'football') {
      let n = {};
      try { n = e.notes ? (typeof e.notes === 'string' ? JSON.parse(e.notes) : e.notes) : {}; } catch (_) {}
      const nm   = e.player_name || '';
      const g    = n.gain;
      const yd   = v => `${v} yard${Math.abs(v) === 1 ? '' : 's'}`;
      // the situation the play LEFT behind — "… — 2nd & 4"
      const dd   = n.dd ? ` <span style="opacity:.6">— ${n.dd}</span>` : '';
      const B    = s => `<strong>${s}</strong>`;

      // who made the stop, e.g. "… for 3 yards (Logan Vigue)"
      const tk = n.tackler
        ? ` (${n.tackler}${n.assist ? ', ' + n.assist : ''})`
        : '';
      const conv = (good, kind) =>
        `<span style="color:${good ? 'var(--green)' : 'var(--red)'};font-weight:700">(${kind} ${good ? 'GOOD' : 'NO GOOD'})</span>`;

      switch (e.event_type) {
        case 'touchdown':
          return `<span style="color:var(--green);font-weight:700">TD!</span> — ${n.scoring || B(nm)}`;
        // A conversion is the tail of the touchdown, not a separate play — show
        // the TD it settled, with the result inline.
        case 'extra_point':
          return n.scoring
            ? `<span style="color:var(--green);font-weight:700">TD!</span> — ${n.scoring} ${conv(n.good, 'PAT')}`
            : `Extra point ${n.good ? 'good' : 'no good'}${nm ? ' — ' + nm : ''}`;
        case 'two_point':
          return n.scoring
            ? `<span style="color:var(--green);font-weight:700">TD!</span> — ${n.scoring} ${conv(n.good, '2-pt')}`
            : `2-pt conversion ${n.good ? 'good' : 'failed'}${nm ? ' — ' + nm : ''}`;
        case 'run':
          if (n.fumbleLost) return `${B(nm)} rushes for ${yd(g||0)}, <span style="color:var(--red);font-weight:700">FUMBLE</span>`;
          return `${B(nm)} rushes for ${yd(g||0)}${tk}${dd}`;
        case 'pass_comp':
          return `${B(nm)} ${yd(g||0)} pass to ${n.receiver || ''}${tk}${dd}`;
        case 'pass_incomp':
          return `${B(nm)} pass incomplete${dd}`;
        case 'sack':
          return `${B(nm)} sacked${g != null ? ' for ' + yd(g) : ''}${dd}`;
        case 'interception':
          return `<span style="color:var(--red);font-weight:700">INTERCEPTED</span> by ${B(nm)}`;
        case 'field_goal':
          return `${B(nm)} field goal ${n.good ? 'GOOD' : 'no good'}`;
        case 'punt':
          return `${B(nm)} punts${dd}`;
        case 'kickoff':
          return `Kickoff${nm ? ' — ' + nm : ''}`;
        case 'kick_return_td':
          return `<span style="color:var(--green);font-weight:700">TD!</span> — ${B(nm)} return`;
        case 'penalty': {
          const pen = n.name || n.type || 'Penalty';
          const on  = n.on ? ` on ${n.on}` : '';
          const auto = n.autoFirst ? ', automatic first' : '';
          return `<span style="color:var(--red);font-weight:700">Flag</span> — ${pen}${on}${n.yds ? ', ' + n.yds + ' yd' + (Math.abs(n.yds)===1?'':'s') : ''}${auto}${dd}`;
        }
        case 'timeout':
          return `Timeout${nm ? ' — ' + nm : ''}`;
        case 'game_over':
          return 'Final';
        default:
          return nm ? `${B(nm)} — ${String(e.event_type).replace(/_/g,' ')}` : String(e.event_type).replace(/_/g,' ');
      }
    }

    if (sport === 'basketball') {
      const lbl  = BBALL_LABEL[e.event_type] || (e.event_type||'').replace(/_/g,' ');
      const name = e.player_name || '';
      const isFoul = (e.event_type||'').indexOf('foul_') === 0;
      const isTO   = (e.event_type||'').indexOf('timeout_') === 0;
      const POS = ['2pt_made','3pt_made','putback_made','ft_made','o_reb','d_reb','assist','steal','block'];
      let n = null;
      try { n = e.notes ? (typeof e.notes === 'string' ? JSON.parse(e.notes) : e.notes) : null; } catch (_) {}
      // Timeout: show which team and how many they have left.
      if (isTO && n && n.tol) {
        const left = (n.tol.full||0) + (n.tol.half||0);
        const team = game ? (n.side === 'home' ? game.home_team : game.away_team) : null;
        const who  = team && team.school_name ? team.school_name + ' ' : '';
        return `${who}${lbl} <span style="opacity:.55">(${left} TO left)</span>`;
      }
      // Player line (points, rebounds, assists, steals, blocks, fouls) on scoring plays and fouls.
      let line = '';
      if (name && n && n.ln && (POS.includes(e.event_type) || isFoul)) {
        const l = n.ln, parts = [`${l.pts||0}p`];
        if (l.reb)   parts.push(`${l.reb}r`);
        if (l.ast)   parts.push(`${l.ast}a`);
        if (l.stl)   parts.push(`${l.stl}s`);
        if (l.blk)   parts.push(`${l.blk}b`);
        if (l.fouls) parts.push(`${l.fouls}f`);
        line = ` <span style="opacity:.55">(${parts.join(' ')})</span>`;
      }
      return name ? `<strong>${name}</strong> — ${lbl}${line}` : lbl;
    }
    const isDP     = e.notes && e.notes.includes('(DP)');
    const evtLabel = isDP ? 'grounds into double play' : (EVT_LABEL[e.event_type] || e.event_type.replace(/_/g,' '));
    const name     = e.event_type === 'sub_pitcher' ? '' : (e.player_name || '');

    if (e.event_type === 'sub_pitcher' && e.pitcher_name) {
      try {
        const info = JSON.parse(e.notes||'{}');
        return info.outgoing ? `Pitching change: ${info.incoming} replaces ${info.outgoing}` : `Pitching change: ${e.pitcher_name}`;
      } catch { return `Pitching change: ${e.pitcher_name}`; }
    }

    if (e.event_type === 'runner_advance') {
      try {
        const info = typeof e.notes === 'string' ? JSON.parse(e.notes||'{}') : (e.notes||{});
        if (info.sb) {
          const rName = info.runner || e.player_name || '';
          const dest  = info.to === 2 ? '2nd' : info.to === 3 ? '3rd' : '';
          return `<strong>${rName}</strong> — Stolen base${dest ? ' (1st→'+dest+')' : ''}`;
        }
        if (e.runs) {
          const scorer     = info.scorers?.[0];
          const scorerName = scorer ? scorer.name : (info.runner || '');
          return `<strong>${name}</strong> — ${scorerName ? scorerName + ' scores' : 'runner scores'} · ${e.runs} run${e.runs>1?'s':''}`;
        }
        return null;
      } catch { return null; }
    }

    const scored = e.runs ? ` · ${e.runs} run${e.runs>1?'s':''}` : '';
    const rbi    = e.rbi && !e.runs ? ` · ${e.rbi} RBI` : '';
    const isOut  = ['groundout','flyout','lineout','popup','strikeout'].includes(e.event_type);
    const outNum = isDP ? ' · 2 outs' : (isOut && e.outs ? ` · ${e.outs} out${e.outs>1?'s':''}` : '');
    let kDesc = '';
    if (e.event_type === 'strikeout' && e.notes) {
      try { const ni = JSON.parse(e.notes||'{}'); if (ni.pitcherK && ni.pitcherName) kDesc = ` (${ni.pitcherName.split(' ').pop()} ${ni.pitcherK}K)`; } catch {}
    }
    return `<strong>${name}</strong> ${evtLabel}${scored}${rbi}${outNum}${kDesc}`;
  }

  function renderScoreBug(topLeftEl, se, sport) {
    if (window.MBRScoreboard && MBRScoreboard.scoreBug(topLeftEl, se, sport, { fmtClock, periodLabel })) return;
    let sn = null;
    try { sn = se.notes ? (typeof se.notes === 'string' ? JSON.parse(se.notes) : se.notes) : null; } catch (_) {}

    // Football: clock + down & distance. Never bases and outs.
    if (sport === 'football') {
      const clk = (sn && sn.clock) || fmtClock(se.clock_seconds) || '';
      const qtr = (sn && sn.qtr) || ('Q' + (se.period || 1));
      const dd  = sn && sn.dd ? sn.dd : '';
      const spot= sn && sn.spot ? sn.spot : '';
      topLeftEl.style.cssText = 'display:flex;align-items:center;gap:6px;flex-wrap:wrap';
      topLeftEl.innerHTML =
        `<span style="font-weight:700">${qtr}</span>${clk?`<span>${clk}</span>`:''}` +
        (dd ? `<span style="opacity:.75">${dd}</span>` : '') +
        (spot ? `<span style="opacity:.55">${spot}</span>` : '');
      return;
    }
    // Soccer / field hockey / lacrosse: clock + period.
    if (['soccer','field_hockey','lacrosse'].includes(sport)) {
      const clk = (sn && sn.clock) || fmtClock(se.clock_seconds) || '';
      const per = (sn && sn.period) || periodLabel(se.period);
      topLeftEl.style.cssText = 'display:flex;align-items:center;gap:6px';
      topLeftEl.innerHTML = `<span style="font-weight:700">${per}</span>${clk?`<span>${clk}</span>`:''}`;
      return;
    }
    if (sport === 'basketball') {
      const clk = fmtClock(se.clock_seconds);
      topLeftEl.style.cssText = 'display:flex;align-items:center;gap:6px';
      topLeftEl.innerHTML = `<span style="font-weight:700">${periodLabel(se.period)}</span>${clk?`<span>${clk}</span>`:''}`;
      return;
    }
    let { half: dispHalf, inning: dispInn = 1, outs: dispOuts = 0 } = se;
    let dispBases = Array.isArray(se.bases) ? se.bases : (se.bases ? JSON.parse(se.bases) : [false,false,false]);
    if (dispOuts >= 3 || se.event_type === 'inning_end') {
      dispBases = [false,false,false]; dispOuts = 0;
      if (dispHalf === 'top') { dispHalf = 'bot'; }
      else { dispHalf = 'top'; dispInn++; }
    }
    const h  = dispHalf === 'top' ? '▲' : '▼';
    const bd = on => `<span style="width:6px;height:6px;border-radius:1px;transform:rotate(45deg);background:${on?'var(--green)':'transparent'};border:1.5px solid ${on?'var(--green)':'rgba(34,168,99,0.45)'};flex-shrink:0"></span>`;
    const od = on => `<span style="width:5px;height:5px;border-radius:50%;background:${on?'var(--green)':'transparent'};border:1.5px solid ${on?'var(--green)':'rgba(34,168,99,0.45)'};flex-shrink:0"></span>`;
    const baseGrid = `<span style="display:grid;grid-template-columns:8px 8px 8px;grid-template-rows:8px 8px;gap:1px;flex-shrink:0"><span></span>${bd(dispBases[1])}<span></span>${bd(dispBases[2])}<span></span>${bd(dispBases[0])}</span>`;
    const outCol   = `<span style="display:flex;flex-direction:column;gap:2px;justify-content:center;flex-shrink:0">${od(dispOuts>0)}${od(dispOuts>1)}</span>`;
    topLeftEl.style.cssText = 'display:flex;align-items:center;gap:5px';
    topLeftEl.innerHTML = `<span style="font-weight:700">${h}${dispInn}</span>${baseGrid}${outCol}`;
  }

  // ── LIVE EVENTS (shared by loadGames + patchLiveGames) ───────────────────
  async function fetchLiveEvents(activeGames) {
    const { data: evts } = await sb.from('game_events')
      .select('game_id, event_type, player_name, pitcher_name, inning, half, outs, runs, rbi, bases, period, clock_seconds, notes, created_at')
      .in('game_id', activeGames.map(g => g.id))
      .neq('event_type', 'lineup_set').neq('event_type', 'batter_up')
      .order('created_at', { ascending: false })
      .limit(activeGames.length * 5);
    if (!evts) return;

    const lastEvt  = {};
    const stateEvt = {};
    evts.forEach(e => {
      if (!stateEvt[e.game_id]) stateEvt[e.game_id] = e;
      const notesStr = typeof e.notes === 'string' ? e.notes : JSON.stringify(e.notes||'');
      const isUninformativeRA = e.event_type === 'runner_advance'
        && !(typeof e.notes === 'object' ? e.notes?.sb : notesStr.includes('"sb":true'))
        && !e.runs;
      if (!lastEvt[e.game_id] && e.event_type !== 'inning_end' && e.event_type !== 'batter_up'
          && !notesStr.includes('out (DP)') && !isUninformativeRA) {
        lastEvt[e.game_id] = e;
      }
    });

    activeGames.forEach(g => {
      const e  = lastEvt[g.id];
      const se = stateEvt[g.id] || e;
      const sport = g._sport;
      if (!e && !se) return;
      if (e) {
        const cardMetaEl = document.querySelector(`[data-game-id="${g.id}"] .card-meta`);
        if (cardMetaEl) {
          const desc = describeEvent(e, sport, g);
          if (desc) {
            let prefix;
            if (sport === 'basketball') prefix = periodLabel(e.period);
            // Football / field sports: the period is already in the score bug above.
            else if (sport === 'football' || ['soccer','field_hockey','lacrosse'].includes(sport)) prefix = '';
            else prefix = `${e.half === 'top' ? '▲' : '▼'}${e.inning||''}`;
            cardMetaEl.innerHTML = `<span style="color:var(--green);font-weight:600">${prefix}</span> ${desc}`;
          }
        }
      }
      if (se) {
        const topLeft = document.querySelector(`[data-game-id="${g.id}"] .card-top > span:first-child`);
        if (topLeft) renderScoreBug(topLeft, se, sport);
      }
    });
  }

    return g.away_team?.team_class || g.away_team?.team_classifications?.[0]?.classes?.name || '?';

    if (activeFilter === 'all') return games;
    return games.filter(g => {
      if (activeFilter === 'Boys' || activeFilter === 'Girls')
        return g.home_team?.gender === activeFilter;

  function renderAllGames() {
    const container = document.getElementById('gamesContainer');

    // Determine which sports to show
    const sportsToShow = activeSport === 'all'
      ? SPORT_PRIORITY.map(s => s.sport).filter(s => allSportsGames[s])
      : [activeSport].filter(s => allSportsGames[s]);

    if (!sportsToShow.length) {
      container.innerHTML = `<div class="games-grid"><div class="empty-state">
        <div class="icon">🏀</div><h3>No games on this date</h3>
        <p>Use the arrows to browse other dates.</p></div></div>`;
      return;
    }

    let html = '';
    for (const sport of sportsToShow) {
      const { games, notesMap } = allSportsGames[sport];
      const filtered = filterGames(games, sport);
      if (!filtered.length) continue;

      const singleGender = SPORT_GENDER[sport];
      const boys  = filtered.filter(g => g.home_team?.gender === 'Boys');
      const girls = filtered.filter(g => g.home_team?.gender === 'Girls');

      // Sport header — only show when displaying multiple sports
      if (activeSport === 'all') {
        html += `<div class="sport-section-header">${SPORT_DISPLAY_NAME[sport] || sport}</div>`;
      }

      if (boys.length  && activeFilter !== 'Girls' && (!singleGender || singleGender === 'Boys'))
        html += section('Boys',  boys,  notesMap, sport);
      if (girls.length && activeFilter !== 'Boys'  && (!singleGender || singleGender === 'Girls'))
        html += section('Girls', girls, notesMap, sport);
    }

    if (!html) {
      container.innerHTML = `<div class="games-grid"><div class="empty-state">
        <div class="icon">🏀</div><h3>No games match this filter</h3>
        <p>Try a different filter.</p></div></div>`;
      return;
    }

    container.innerHTML = html;
    // delegation handles all card interactions
  }

    if (form) syncBaseballPeriod(form, form._activeHalf || '');

  // Baseball top/bot pills → toggle activeHalf, sync period
  _gc.addEventListener('click', e => {
    const pill = e.target.closest('.si-pill[data-half]');
    if (!pill) return;
    const form = pill.closest('.score-form');
    if (!form) return;
    const pills = form.querySelectorAll('.si-pill[data-half]');
    pills.forEach(p => p.classList.remove('active'));
    if (form._activeHalf === pill.dataset.half) {
      form._activeHalf = '';

      pill.classList.add('active');
      form._activeHalf = pill.dataset.half;

  function card(g, notesMap = {}, sport = activeSport) {
    const home    = g.home_team;
    const away    = g.away_team;
    const homeCls = getHomeClass(g);
    const awayCls = getAwayClass(g);
    const crossCls = homeCls !== awayCls;
    const clsLabel = crossCls ? 'Cross-class' : `Class ${homeCls}`;
    const topLabel = g.event || `${clsLabel} · ${home.gender}`;
    const isFinal = g.status === 'final';
    const isLive  = g.status === 'active';
    const isPPD   = g.status === 'postponed';

    const hSc = isFinal ? g.home_score : (isLive ? g.home_score_live : null);
    const aSc = isFinal ? g.away_score : (isLive ? g.away_score_live : null);
    const has = hSc !== null && aSc !== null;

    const hWin = isFinal && has && hSc > aSc;
    const aWin = isFinal && has && aSc > hSc;

    const hRnk = rankMap[home.id];
    const aRnk = rankMap[away.id];
    const hSeed = g.is_tournament ? seedMap[home.id] : null;
    const aSeed = g.is_tournament ? seedMap[away.id] : null;
    const hR   = hSeed ? `<span class="rnk">#${hSeed} </span>` : (hRnk ? `<span class="rnk">#${hRnk} </span>` : '');
    const aR   = aSeed ? `<span class="rnk">#${aSeed} </span>` : (aRnk ? `<span class="rnk">#${aRnk} </span>` : '');

    // PPD badge label (needed for topBar)
    let ppdLabel = '';
    if (isPPD) {
      const nd = g.new_date;
      if (nd) {
        const d = new Date(nd + 'T12:00:00');
        let label = 'PPD · ' + d.toLocaleDateString('en-US', { month: 'numeric', day: 'numeric' });
        if (g.game_time) label += ' · ' + fmtTime(g.game_time);
        ppdLabel = label;
      } else {
        ppdLabel = 'PPD';
      }
    }

    // Top status bar
    const submitBtnTop = !isPPD
      ? `<button class="submit-btn-inline" data-id="${g.id}">${isFinal ? 'Edit' : isLive ? 'Update' : 'Submit'}</button>`
      : `<span></span>`;
    const topBar = isFinal
      ? `<div class="card-top"><span>Final</span><span class="card-top-center">${topLabel}</span>${submitBtnTop}</div>`
      : isLive
        ? `<div class="card-top" style="color:#22a863"><span><span class="live-dot"></span>${g.game_clock ? g.game_clock : 'Live'}</span><span class="card-top-center">${topLabel}</span>${submitBtnTop}</div>`
        : isPPD
          ? `<div class="card-top" style="color:#c0392b"><span>Postponed</span><span class="card-top-center" style="display:flex;align-items:center;gap:6px">${topLabel} <span class="ppd-badge">${ppdLabel}</span></span><span></span></div>`
          : `<div class="card-top"><span>${g.game_time ? fmtTime(g.game_time) : 'Scheduled'}</span><span class="card-top-center">${topLabel}</span>${submitBtnTop}</div>`;

    // Score cells
    const gamePageUrl = `https://www.mainebasketballrankings.com/game/?id=${g.id}`;
    const hScEl = has
      ? (isFinal
          ? `<a class="team-score ${hWin?'winner':'loser'}" href="${gamePageUrl}" target="_blank" style="text-decoration:none">${hSc}</a>`
          : `<div class="team-score">${hSc}</div>`)
      : `<div class="team-score empty">–</div>`;
    const aScEl = has
      ? (isFinal
          ? `<a class="team-score ${aWin?'winner':'loser'}" href="${gamePageUrl}" target="_blank" style="text-decoration:none">${aSc}</a>`
          : `<div class="team-score">${aSc}</div>`)
      : `<div class="team-score empty">–</div>`;

    // Footer
    const loc = g.location || (g.is_neutral_site ? 'Neutral site' : `@ ${home.school_name}`);
    const dateShort = fmtShortDate(g.game_date);
    const streamUrl = g.is_summer ? (g.stream_url || null) : (g.stream_url || home.stream_url || null);
    const eventEl = g.event ? `<span style="color:var(--green);font-weight:700">${g.event} · </span>` : '';
    const notes = notesMap[g.id];

    // State-aware footer meta
    let footerMeta;
    if (isFinal) {
      const notesContent = notes || '—';
      const notesStyle = notes ? 'color:var(--black)' : 'color:var(--lgray)';
      footerMeta = `<a class="card-meta" href="${gamePageUrl}" target="_blank" style="${notesStyle};text-decoration:none">${notesContent}</a>`;
    } else if (isLive) {
      footerMeta = `<div class="card-meta" style="color:var(--lgray)">In progress</div>`;
    } else {
      footerMeta = `<div class="card-meta">${eventEl}${loc}<br/>${dateShort}${g.game_time ? ' · ' + fmtTime(g.game_time) : ''}</div>`;
    }

    return `
    <div class="game-card ${isLive ? 'live' : ''} ${isPPD ? 'postponed' : ''}" data-game-id="${g.id}">
      ${topBar}
      <div class="card-body">
        <div class="team-row">
          <div class="logo-wrap">${logoEl(away)}</div>
          <div class="team-name-wrap">
            <a class="team-name ${isFinal ? (aWin?'winner':'loser') : ''}" href="https://app.mainebasketballrankings.com/team_embed.html?team_id=${away.id}" target="_blank">${aR}${away.school_name}</a>${recordMap[away.id] ? ` <span style="font-size:12px;color:var(--lgray);font-weight:400;font-family:'Barlow Condensed',sans-serif;display:block;line-height:1.2;margin-top:1px">${recordMap[away.id]}</span>` : ''}
          </div>
          ${aScEl}
        </div>
        <div class="team-row">
          <div class="logo-wrap">${logoEl(home)}</div>
          <div class="team-name-wrap">
            <a class="team-name ${isFinal ? (hWin?'winner':'loser') : ''}" href="https://app.mainebasketballrankings.com/team_embed.html?team_id=${home.id}" target="_blank">${hR}${home.school_name}</a>${recordMap[home.id] ? ` <span style="font-size:12px;color:var(--lgray);font-weight:400;font-family:'Barlow Condensed',sans-serif;display:block;line-height:1.2;margin-top:1px">${recordMap[home.id]}</span>` : ''}
          </div>
          ${hScEl}
        </div>
      </div>
      <div class="card-footer">
        ${footerMeta}
        <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
          ${staxEl(g.stax_index)}
          ${streamUrl ? streamIconEl(streamUrl) : ''}
          ${isLive ? `<a href="https://app.mainebasketballrankings.com/live.html?game_id=${g.id}" class="live-btn" target="_blank">LIVE</a>` : ''}
          ${!isFinal && !isPPD && !isLive ? `<button class="ppd-btn" data-ppd-id="${g.id}">PPD</button>` : ''}
          ${isPPD ? `<button class="ppd-btn" data-ppd-id="${g.id}" style="border-color:#c0392b;color:#c0392b">Edit PPD</button>` : ''}
        </div>
      </div>
      ${!isFinal ? `
      <div class="ppd-panel" id="ppd-panel-${g.id}">
        <h4>Report Postponement</h4>
        <div class="ppd-row">
          <input type="date" class="ppd-date-input" id="ppd-date-${g.id}" placeholder="Reschedule date (optional)" />
          <input type="time" class="ppd-time-input" id="ppd-time-${g.id}" />
          <button type="button" class="ppd-submit" data-ppd-submit="${g.id}">Mark PPD</button>
        </div>
        <div class="ppd-hint">Date and time are both optional — leave blank if unknown</div>
      </div>` : ''}
      ${!isPPD ? `
      <div class="submit-panel" id="panel-${g.id}">
        <h4>${isFinal ? 'Edit Score' : 'Submit Score'}</h4>
        ${!isFinal && (sport==='baseball'||sport==='softball') ? `
        <a href="baseball_scorer.html?game_id=${g.id}" target="_blank" style="display:block;margin-bottom:10px;padding:8px 12px;background:var(--green);color:#fff;border-radius:7px;font-size:13px;font-weight:600;text-decoration:none;text-align:center;">
          Score This Game Live →
        </a>` : ''}
        <form class="score-form" data-id="${g.id}" data-sport="${sport}">
          <div class="score-inputs">
            <div class="si-group">
              <label>${home.school_name}</label>
              <input type="number" name="home_score" min="0" max="250" placeholder="0" value="${isFinal && hSc !== null ? hSc : ''}" required />
            </div>
            <div class="si-dash">–</div>
            <div class="si-group">
              <label>${away.school_name}</label>
              <input type="number" name="away_score" min="0" max="250" placeholder="0" value="${isFinal && aSc !== null ? aSc : ''}" required />
            </div>
          </div>
          <div class="si-extras">
            <div class="si-clock-row">
              ${periodClockHTML(sport)}
            </div>
            <textarea name="notes" placeholder="Notes (e.g. Nolan Ames 32 pts 10 reb)">${notesMap[g.id] || ''}</textarea>
          </div>
          <div class="si-row">
            <label class="final-label">
              <input type="checkbox" name="is_final" ${isFinal ? 'checked' : ''} /> Final score
            </label>
            <button type="submit" class="si-submit">${isFinal ? 'Save' : 'Submit'}</button>
          </div>
          <div class="si-success" id="ok-${g.id}">✓ Saved!</div>
        </form>
      </div>` : ''}
    </div>`;
  }

  function syncBaseballPeriod(form, activeHalf) {
    const inningSel = form.querySelector('select[name="inning"]');
    const hiddenPeriod = form.querySelector('input[name="period"]');
    if (!inningSel || !hiddenPeriod) return;
    const inn = inningSel.value;
    if (!inn) { hiddenPeriod.value = ''; return; }
    if (inn === 'F') { hiddenPeriod.value = 'Final'; return; }
    hiddenPeriod.value = activeHalf ? `${activeHalf} ${inn}` : `Inn ${inn}`;
  }

  async function handleSubmit(e) {
    e.preventDefault();
    const form   = e.target;
    const id     = form.dataset.id;
    const btn    = form.querySelector('.si-submit');
    const ok     = document.getElementById('ok-' + id);

    const hSc = parseInt(form.home_score.value);
    const aSc = parseInt(form.away_score.value);
    if (isNaN(hSc) || isNaN(aSc)) return;

    const period    = form.period ? form.period.value : '';
    const clockTime = form.clock_time ? form.clock_time.value.trim() : '';
    const noTime    = ['Halftime', 'End Q4', 'Final', '1st Half', '2nd Half', 'OT', ''].includes(period);
    const gameClock = period
      ? (noTime || !clockTime ? period : `${period} | ${clockTime}`)
      : null;
    const isFinal = form.is_final.checked;

    btn.disabled = true;
    btn.textContent = 'Submitting…';

    // Write directly to games table — auto-authorized
    const gameUpdate = isFinal
      ? { status: 'final', home_score: hSc, away_score: aSc, game_clock: gameClock, notes: form.notes.value.trim() || null }
      : { status: 'active', home_score_live: hSc, away_score_live: aSc, game_clock: gameClock, notes: form.notes.value.trim() || null };

    const { error } = await sb.from('games').update(gameUpdate).eq('id', id);

    // Also log to score_submissions for audit trail
    await sb.from('score_submissions').insert({
      game_id: id, home_score: hSc, away_score: aSc,
      is_final: isFinal,
      game_clock: gameClock,
      notes: form.notes.value.trim() || null,
      status: 'approved',
    });

    if (error) {
      showToast('Failed: ' + error.message, true);
      btn.disabled = false; btn.textContent = 'Submit';
      return;
    }

    // Show success briefly, then re-enable for further updates
    ok.style.display = 'block';
    showToast(isFinal ? '✓ Final score saved!' : '✓ Score updated!');
    setTimeout(() => {
      ok.style.display = 'none';
      btn.disabled = false;
      btn.textContent = 'Update';
    }, 2500);

    // Patch just this card's scores in place — no page reload
    if (isFinal) {
      patchCardFinal(id, hSc, aSc, gameClock,
        allGames.find(g => g.id === id),
        form.notes.value.trim() || null);
    } else {
      patchCardScores(id, hSc, aSc, gameClock);
    }
  }

  function showToast(msg, isError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className   = 'toast show' + (isError ? ' error' : '');
    setTimeout(() => t.className = 'toast', 3000);
  }

  function syncDatePicker() {
    document.getElementById('datePicker').value = toISO(currentDate);
  }

  function navigateTo(date) {
    syncDatePicker();
    activeSport  = 'all';
    activeFilter = 'all';
    loadGames(date);
  }

  document.getElementById('prevDay').addEventListener('click', () => {
    currentDate.setDate(currentDate.getDate() - 1); navigateTo(currentDate);
  });
  document.getElementById('nextDay').addEventListener('click', () => {
    currentDate.setDate(currentDate.getDate() + 1); navigateTo(currentDate);
  });
  document.getElementById('todayBtn').addEventListener('click', () => {
    currentDate = new Date(); navigateTo(currentDate);
  });
  document.getElementById('datePicker').addEventListener('change', e => {
    const [y,m,d] = e.target.value.split('-').map(Number);
    currentDate = new Date(y, m-1, d);
    navigateTo(currentDate);
  });

  document.getElementById('sportTabs').addEventListener('click', e => {
    if (!e.target.matches('.sport-tab')) return;
    document.querySelectorAll('.sport-tab').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    activeSport  = e.target.dataset.sport;
    activeSeason = parseInt(e.target.dataset.season) || 2026;
    activeFilter = 'all';
    if (activeSport !== 'all' && allSportsGames[activeSport]) {
      // Already cached — just re-render, no fetch needed
      allGames = allSportsGames[activeSport].games;
      buildFilterButtons();
      renderAllGames();
    } else {
      loadGames(currentDate, false);
    }
  });

  document.getElementById('filters').addEventListener('click', e => {
    if (!e.target.matches('.filter-btn')) return;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    activeFilter = e.target.dataset.filter;
    renderAllGames();
  });

  // Sport priority order for auto-detection
  const SPORT_PRIORITY = [
    { sport: 'basketball', season: 2026 },
    { sport: 'football',   season: 2026 },
    { sport: 'baseball',   season: 2026 },
    { sport: 'softball',   season: 2026 },
    { sport: 'soccer',     season: 2026 },
    { sport: 'lacrosse',   season: 2026 },
    { sport: 'field-hockey', season: 2026 },
    { sport: 'volleyball',   season: 2026 },
  ];


  syncDatePicker();

  // Load all sports for today
  activeSport = 'all';

  // ── LIVE PATCH (non-destructive background refresh) ─────────────────────
  // Fetches only games data + events and patches DOM in place.
  // Never rebuilds the page, so scroll position and open forms are preserved.

  async function patchLiveGames() {
    const ds = toISO(currentDate);
    // Only re-fetch sports already in cache (i.e. visible on this date)
    const cachedSports = SPORT_PRIORITY.filter(({ sport }) => allSportsGames[sport]);
    if (!cachedSports.length) return;

    const results = await Promise.all(
      cachedSports.map(({ sport, season }) =>
        fetchSportGames(ds, sport, season).then(games => ({ sport, games }))
      )
    );

    // Update cache with fresh data
    results.forEach(({ sport, games }) => {
      allSportsGames[sport] = { games, notesMap: buildNotesMap(games) };
    });

    const freshGames = results.flatMap(r => r.games);
    const newlyFinal = [];

    freshGames.forEach(g => {
      const cardEl = document.querySelector(`[data-game-id="${g.id}"]`);
      if (!cardEl) return;

      const wasLive = cardEl.classList.contains('live');
      const isFinal = g.status === 'final';
      const isLive  = g.status === 'active';
      const hSc = isFinal ? g.home_score : (isLive ? g.home_score_live : null);
      const aSc = isFinal ? g.away_score : (isLive ? g.away_score_live : null);

      if (hSc !== null && aSc !== null) {
        const rows = cardEl.querySelectorAll('.team-row');
        if (rows.length === 2) {
          const awayScoreEl = rows[0].querySelector('.team-score');
          const homeScoreEl = rows[1].querySelector('.team-score');
          if (awayScoreEl) { awayScoreEl.textContent = aSc; awayScoreEl.className = `team-score${isFinal ? (aSc > hSc ? ' winner' : ' loser') : ''}`; }
          if (homeScoreEl) { homeScoreEl.textContent = hSc; homeScoreEl.className = `team-score${isFinal ? (hSc > aSc ? ' winner' : ' loser') : ''}`; }
        }
      }
      if (g.game_clock) {
        const topLeft = cardEl.querySelector('.card-top > span:first-child');
        if (topLeft && isLive && !topLeft.querySelector('span[style*="grid"]')) {
          topLeft.innerHTML = `<span class="live-dot"></span>${g.game_clock}`;
        }
      }
      if (isFinal && wasLive) newlyFinal.push(g);
    });

    for (const g of newlyFinal) {
      const cardEl = document.querySelector(`[data-game-id="${g.id}"]`);
      if (!cardEl) continue;
      const sport    = cardEl.closest('[data-sport-section]')?.dataset.sportSection || activeSport;
      const notesMap = buildNotesMap([g]);
      cardEl.outerHTML = card(g, notesMap, sport);
      // no attachCardListeners needed — delegation handles it
    }

    const activeGames = freshGames.filter(g => g.status === 'active');
    if (activeGames.length) await fetchLiveEvents(activeGames);
  }

  // Patch a single card's scores in place after a submit (no status change yet)
  function patchCardScores(id, hSc, aSc, gameClock) {
    const cardEl = document.querySelector(`[data-game-id="${id}"]`);
    if (!cardEl) return;
    const rows = cardEl.querySelectorAll('.team-row');
    if (rows.length === 2) {
      const awayScoreEl = rows[0].querySelector('.team-score');
      const homeScoreEl = rows[1].querySelector('.team-score');
      if (awayScoreEl) { awayScoreEl.textContent = aSc; awayScoreEl.className = 'team-score'; }
      if (homeScoreEl) { homeScoreEl.textContent = hSc; homeScoreEl.className = 'team-score'; }
    }
    if (gameClock) {
      const topLeft = cardEl.querySelector('.card-top > span:first-child');
      if (topLeft) topLeft.innerHTML = `<span class="live-dot"></span>${gameClock}`;
    }
    // Mark card as live if not already
    cardEl.classList.add('live');
    const cardTop = cardEl.querySelector('.card-top');
    if (cardTop) cardTop.style.color = '#22a863';
  }

  // Patch a card that just became final — re-render it fully but in-place
  function patchCardFinal(id, hSc, aSc, gameClock, gameObj, notes) {
    const cardEl = document.querySelector(`[data-game-id="${id}"]`);
    if (!cardEl || !gameObj) return;
    const updated = { ...gameObj, status: 'final', home_score: hSc, away_score: aSc, game_clock: gameClock, notes };
    const sport = activeSport !== 'all' ? activeSport : 'baseball';
    const notesMap = buildNotesMap([updated]);
    cardEl.outerHTML = card(updated, notesMap, sport);
    // no attachCardListeners needed — delegation handles it
  }
  // ── END LIVE PATCH ────────────────────────────────────────────────────────

  setInterval(patchLiveGames, 30000);

  // ── PPD ─────────────────────────────────────────────────────────────────
  document.getElementById('gamesContainer').addEventListener('click', e => {
    // Toggle PPD panel
    const ppdBtn = e.target.closest('[data-ppd-id]');
    if (ppdBtn && !ppdBtn.dataset.ppdSubmit) {
      const id = ppdBtn.dataset.ppdId;
      const panel = document.getElementById('ppd-panel-' + id);
      if (!panel) return;
      // Close score panel if open
      const scorePanel = document.getElementById('panel-' + id);
      if (scorePanel) scorePanel.classList.remove('open');
      panel.classList.toggle('open');
      // Pre-populate date/time from game data if editing an existing PPD
      if (panel.classList.contains('open')) {
        const game = allGames.find(g => g.id === id);
        if (game) {
          const dateEl = document.getElementById('ppd-date-' + id);
          const timeEl = document.getElementById('ppd-time-' + id);
          if (dateEl && game.new_date && !dateEl.value) dateEl.value = game.new_date;
        }
      }
      return;
    }

    // Submit PPD
    const submitBtn = e.target.closest('[data-ppd-submit]');
    if (submitBtn) {
      const id = submitBtn.dataset.ppdSubmit;
      handlePPD(id, submitBtn);
    }
  });

  async function handlePPD(id, btn) {
    const dateInput = document.getElementById('ppd-date-' + id);
    const timeInput = document.getElementById('ppd-time-' + id);
    const newDate   = dateInput ? dateInput.value.trim() : '';
    const newTime   = timeInput ? timeInput.value.trim() : '';

    btn.disabled = true;
    btn.textContent = 'Saving…';

    const update = { status: 'postponed' };
    if (newDate) update.new_date = newDate;
    if (newTime) update.game_time = newTime;

    const { error } = await sb.from('games').update(update).eq('id', id);

    if (error) {
      showToast('Failed: ' + error.message, true);
      btn.disabled = false;
      btn.textContent = 'Mark PPD';
      return;
    }

    showToast('Game marked as postponed.');
    setTimeout(() => loadGames(currentDate), 800);
  }
  // ── END PPD ──────────────────────────────────────────────────────────────

</script>

<script>loadGames(currentDate);</script>

<div style="text-align:center;padding:12px 0 16px;font-size:11px;color:#aaa;font-family:'Barlow',sans-serif">
  Powered by <a href="https://mainebasketballrankings.com" target="_blank" style="color:#1a7a4a;text-decoration:none;font-weight:600">Maine Basketball Rankings</a>
</div>

<script>
// Auto-resize: tells the parent page how tall this embed is
// so the iframe can resize to fit content without scrollbars or dead space.
// Works by posting the document height to the parent whenever content changes.

(function() {
  function sendHeight() {
    const h = document.documentElement.scrollHeight;
    window.parent.postMessage({ type: 'mbr-embed-resize', height: h }, '*');
  }

  // Send on load
  window.addEventListener('load', sendHeight);

  // Send whenever DOM changes (games load, tabs switch, etc.)
  const observer = new ResizeObserver(sendHeight);
  observer.observe(document.body);

  // Also send on any click (tab switches change height)
  document.addEventListener('click', () => setTimeout(sendHeight, 100));
})();

</script>
</body>
</html>
